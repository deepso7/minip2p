# Timing in tests
#
# These are wall-clock tests of a networking stack, run in parallel. Under load
# a thread can be descheduled for longer than any budget a test would pick, so:
#
# - A fixed-duration loop must never stand in for progress. Drive until the
#   thing you are waiting for is observable — the peer reclaimed, the socket
#   parked, the event arrived — and let the loop end there.
# - A remaining time limit is a failure backstop or the timer under test,
#   nothing else. Backstops should be generous; they only turn a hang into a
#   readable failure.
# - A test of a deliberately bounded production timer (`Endpoint::close()`
#   drains for a fixed 500ms) cannot be made load-proof from the inside. It
#   keeps its strict assertions and gets `threads-required =
#   "num-test-threads"` below, so nothing else runs beside it.
# - Poll once more after an observation window closes. A stall can carry the
#   loop past its deadline with the event that would have failed it unread.
# - "Nothing arrives during this quiet window" assertions are best effort:
#   starvation can only make them pass when they should fail, so they are left
#   alone. "The connection stays up" is the opposite case — starvation expires
#   timers and fails it with nothing broken — so it takes the box as well.
#
# The `variants` profile drops one test: the reconnect-churn soak.
#
# It is gated on `quic` alone and does 50 connect/handshake/drop rounds to guard
# the listener-state leak fix, so it costs ~14s and the rounds are the point —
# shortening it would blunt what it was written to catch. The workspace run
# covers it under default features, which is the only configuration it is gated
# on. Re-running it once per Endpoint feature variant added ~133s per CI run for
# no extra coverage: none of nat, pubsub, discovery, mdns, or tcp touch QUIC
# listener state.
#
# The filter names that one test rather than its binary. The other four tests in
# reconnect_churn cost ~1s combined, and the variants do enable QUIC, so
# excluding the whole binary would drop real coverage to save a second.
#
# Feature variants run under this profile; the workspace run does not.
[profile.variants]
default-filter = '''
  not (
    binary_id(minip2p-rs::reconnect_churn)
    and test(=listener_reclaims_state_after_dialer_drop_without_disconnect)
  )
'''

# Two tests wait on quiche's idle timer — `stop_sending_drops_queued_writes_…`
# and `quic_deadline_is_exposed_…`. Its effective value is max(idle, 3×PTO).
# PTO follows the RTT quiche measures, and a descheduled thread inflates that,
# so under load the timer these tests are waiting for moves further away the
# more loaded the box is — a margin cannot be picked that survives it. They take
# the box instead.
#
# Two more prove a quiet connection survives past its idle timeout —
# `quiet_pair_stays_up_…` and `idle_quic_relay_reservation_stays_live_…` —
# driving both endpoints from one thread: a thread that stops polling for long
# enough expires the connection their assertions require to still be up.
# Running alone also keeps PTO near loopback scale, so the effective timeout
# they have to outlast stays near the configured one. That mitigates rather
# than bounds it: a pause from outside the suite can still stretch PTO.
#
# The close-drain tests assert on the events `Endpoint::close()` returns, and
# `close()` drains for a fixed 500ms by design — shutdown stays bounded, so the
# events it returns are best effort. The assertions are not: they are what keeps
# a superseded connection from being dropped silently. The only way to have both
# is to stop the box from stealing those 500ms, so these three run alone.
#
# `threads-required` is what does that. A `[test-groups]` entry with
# `max-threads = 1` would only keep the group's own members apart, leaving the
# rest of the suite running alongside. Default-profile overrides also apply
# under `variants`, so this one entry covers the feature matrix too.
[[profile.default.overrides]]
filter = '''
  (
    binary_id(minip2p-rs::reconnect_churn)
    and (
      test(=listener_reclaims_state_after_dialer_close)
      or test(=close_drains_replacement_connection)
      or test(=close_drains_pending_replacement_handshake)
    )
  )
  or test(=stream_send_tests::stop_sending_drops_queued_writes_and_keeps_the_endpoint_polling)
  or test(=quic_deadline_is_exposed_and_driven_without_socket_input)
  or test(=quiet_pair_stays_up_past_idle_timeout)
  or test(=std::nat_tests::idle_quic_relay_reservation_stays_live_past_transport_timeout)
'''
threads-required = "num-test-threads"
