name: Bench

on:
  release:
    types: [published]
  pull_request_target:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  AWS_REGION: ${{ vars.AWS_BENCH_REGION || 'us-east-1' }}
  BENCH_STAGE: run-${{ github.run_id }}-${{ github.run_attempt }}
  BENCH_CLUSTER: minip2p-bench-run-${{ github.run_id }}-${{ github.run_attempt }}
  BENCH_TASK_FAMILY: minip2p-bench-run-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  aws-bench:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: aws-bench
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    outputs:
      complete: ${{ steps.result.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.pull_request.base.sha || github.sha }}
      - name: Check out benchmark source
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: bench-source
      - name: Resolve benchmark source
        id: source
        env:
          SOURCE_DIR: ${{ github.event_name == 'pull_request_target' && format('{0}/bench-source', github.workspace) || github.workspace }}
        run: echo "sha=$(git -C "$SOURCE_DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.24.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: infra/bench/pnpm-lock.yaml
      - name: Install infrastructure dependencies
        working-directory: infra/bench
        run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_BENCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: Measure
        id: measure
        env:
          BENCH_GIT_SHA: ${{ steps.source.outputs.sha }}
          BENCH_SOURCE_DIR: ${{ github.event_name == 'pull_request_target' && format('{0}/bench-source', github.workspace) || github.workspace }}
        run: |
          cd infra/bench
          pnpm run deploy
          cd ../..
          scripts/run-aws-bench-task.sh
      - name: Refresh AWS credentials for cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_BENCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: Remove benchmark stack
        if: always()
        working-directory: infra/bench
        run: pnpm run destroy
      - name: Prepare result slice
        id: result
        if: always()
        env:
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
          BENCH_GIT_SHA: ${{ steps.source.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          complete=false
          if [ "$MEASURE_OUTCOME" = success ] && python3 scripts/bench_results.py merge target/bench-artifacts/current.json --output target/bench-artifacts/current.json --git-sha "$BENCH_GIT_SHA"; then
            complete=true
          else
            mkdir -p target/bench-artifacts
            jq -n --arg sha "$BENCH_GIT_SHA" '{schema_version: 1, git_sha: $sha, rows: []}' > target/bench-artifacts/current.json
          fi
          if [ -f target/bench-fargate.log ]; then
            mv target/bench-fargate.log target/bench-artifacts/bench-fargate.log
          fi
          if [ -n "$PR_NUMBER" ]; then
            printf '%s\n' "$PR_NUMBER" > target/bench-artifacts/pr-number
            printf '%s\n' "$BENCH_GIT_SHA" > target/bench-artifacts/head-sha
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bench-aws
          path: target/bench-artifacts/
          if-no-files-found: error

  baseline:
    if: >-
      github.event_name == 'release' &&
      needs.aws-bench.outputs.complete == 'true'
    needs: [aws-bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/bench-slices
          merge-multiple: true
      - name: Merge result slices
        run: python3 scripts/bench_results.py merge "$RUNNER_TEMP"/bench-slices/*.json --output "$RUNNER_TEMP/results.json" --git-sha "$GITHUB_SHA"
      - name: Update baseline branch
        env:
          BASELINE_DIR: ${{ runner.temp }}/bench-data
          BASELINE_LABEL: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git worktree add --detach "$BASELINE_DIR"
          for attempt in 1 2 3; do
            if git -C "$BASELINE_DIR" fetch --depth=1 origin bench-data; then
              git -C "$BASELINE_DIR" checkout -B bench-data FETCH_HEAD
            else
              git -C "$BASELINE_DIR" checkout --orphan "bench-data-$attempt"
              git -C "$BASELINE_DIR" rm -rf .
            fi
            cp "$RUNNER_TEMP/results.json" "$BASELINE_DIR/$GITHUB_SHA.json"
            git -C "$BASELINE_DIR" add "$GITHUB_SHA.json"
            latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [ "$BASELINE_LABEL" = "$latest_release" ]; then
              printf '%s\n' "$GITHUB_SHA" > "$BASELINE_DIR/latest"
              printf '%s\n' "$BASELINE_LABEL" > "$BASELINE_DIR/latest-release"
              git -C "$BASELINE_DIR" add latest latest-release
            fi
            if git -C "$BASELINE_DIR" diff --cached --quiet; then
              exit 0
            fi
            git -C "$BASELINE_DIR" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "bench: $GITHUB_SHA"
            if git -C "$BASELINE_DIR" push origin HEAD:bench-data; then
              exit 0
            fi
          done
          exit 1

  compare:
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      needs.aws-bench.result == 'success' &&
      needs.aws-bench.outputs.complete == 'true'
    needs: [aws-bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/bench-slices
          merge-multiple: true
      - name: Merge result slices
        run: python3 scripts/bench_results.py merge "$RUNNER_TEMP"/bench-slices/*.json --output "$RUNNER_TEMP/current.json" --git-sha "$(git rev-parse HEAD)"
      - name: Read baseline
        id: baseline
        run: |
          if ! git fetch --depth=1 origin bench-data; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! baseline_sha=$(git show FETCH_HEAD:latest 2>/dev/null) \
            || ! git show "FETCH_HEAD:$baseline_sha.json" > "$RUNNER_TEMP/baseline.json"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          baseline_release=$(git show FETCH_HEAD:latest-release 2>/dev/null || printf 'unknown')
          git cat-file -e "$baseline_sha^{commit}" 2>/dev/null || git fetch origin "$baseline_sha"
          merge_base=$(git merge-base "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}")
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "release=$baseline_release" >> "$GITHUB_OUTPUT"
          if [ "$baseline_sha" = "$merge_base" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare with baseline
        if: steps.baseline.outputs.available == 'true'
        env:
          BASELINE_LABEL: ${{ steps.baseline.outputs.release }}
        run: >-
          python3 scripts/bench_results.py compare
          --current "$RUNNER_TEMP/current.json"
          --baseline "$RUNNER_TEMP/baseline.json"
          --output "$RUNNER_TEMP/comparison.md"
          --baseline-label "$BASELINE_LABEL"
          --check-ir-pins
          --baseline-tree "${{ steps.baseline.outputs.sha }}"
          --current-tree "${{ github.event.pull_request.head.sha }}"
          ${{ steps.baseline.outputs.stale == 'true' && '--stale' || '' }}
      - name: Compare without baseline
        if: steps.baseline.outputs.available != 'true'
        run: python3 scripts/bench_results.py compare --current "$RUNNER_TEMP/current.json" --output "$RUNNER_TEMP/comparison.md"
      - name: Prepare comparison artifact
        run: printf '%s\n' "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/pr-number"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-comparison
          path: |
            ${{ runner.temp }}/comparison.md
            ${{ runner.temp }}/pr-number
          if-no-files-found: error
