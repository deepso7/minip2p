name: Bench

on:
  release:
    types: [published]
  pull_request_target:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to measure (default branch when empty)
        required: false
        default: ""
      sweep:
        description: Emulated-link window sweeps to run instead of the benchmarks (scripts/rtt-sweep.sh names, space-separated, or `all`)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  AWS_REGION: ${{ vars.AWS_BENCH_REGION || 'ap-south-1' }}

jobs:
  # Wakes the self-hosted bench instance (normally stopped; its watchdog
  # powers it off when idle). `aws-bench` is the approval gate for pull
  # requests and manual runs; releases and the weekly keepalive run only
  # trusted code from a tag or `main`, so they use the reviewer-free
  # `aws-bench-unattended`.
  start-runner:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'release' || github.event_name == 'schedule') && 'aws-bench-unattended' || 'aws-bench' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BENCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Start bench runner
        env:
          AWS_BENCH_INSTANCE_ID: ${{ vars.AWS_BENCH_INSTANCE_ID }}
        run: scripts/start-bench-runner.sh

  bench:
    if: github.event_name != 'schedule'
    needs: start-runner
    runs-on: [self-hosted, linux, x64, minip2p-bench]
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      complete: ${{ steps.result.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      # The scripts and Dockerfile that drive the bench host always come from
      # the trusted checkout above; a PR head or a dispatched `ref` is only
      # the code measured (the image's build context), checked out beside it.
      - name: Check out benchmark source
        if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.ref != '')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || inputs.ref }}
          path: bench-source
          persist-credentials: false
      - name: Resolve benchmark source
        id: source
        env:
          SOURCE_DIR: ${{ (github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.ref != '')) && format('{0}/bench-source', github.workspace) || github.workspace }}
        run: echo "sha=$(git -C "$SOURCE_DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # `exec` makes the helper the step's process, so the runner's
      # cancellation signals reach its traps.
      - name: Measure
        id: measure
        env:
          BENCH_GIT_SHA: ${{ steps.source.outputs.sha }}
          BENCH_SWEEP: ${{ inputs.sweep }}
          BENCH_CONTEXT: ${{ (github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.ref != '')) && 'bench-source' || '.' }}
          BENCH_NO_CACHE: ${{ github.event_name == 'release' && '1' || '' }}
        run: exec scripts/run-bench-container.sh
      - name: Prepare result slice
        id: result
        if: always()
        env:
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
          BENCH_GIT_SHA: ${{ steps.source.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          complete=false
          mkdir -p target/bench-artifacts
          if [ "$MEASURE_OUTCOME" = success ] && python3 scripts/bench_results.py merge target/bench-artifacts/current.json --output target/bench-artifacts/current.json --git-sha "$BENCH_GIT_SHA"; then
            complete=true
          else
            jq -n --arg sha "$BENCH_GIT_SHA" '{schema_version: 1, git_sha: $sha, rows: []}' > target/bench-artifacts/current.json
          fi
          if [ -n "$PR_NUMBER" ]; then
            printf '%s\n' "$PR_NUMBER" > target/bench-artifacts/pr-number
            printf '%s\n' "$BENCH_GIT_SHA" > target/bench-artifacts/head-sha
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: target/bench-artifacts/
          if-no-files-found: error

  # The weekly schedule connects the runner so GitHub does not remove it
  # after 14 days offline; the watchdog stops the instance afterwards.
  keepalive:
    if: github.event_name == 'schedule'
    needs: start-runner
    runs-on: [self-hosted, linux, x64, minip2p-bench]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: "true"

  baseline:
    if: >-
      github.event_name == 'release' && needs.bench.outputs.complete == 'true'
    needs: [bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/bench-slices
          merge-multiple: true
      - name: Merge result slices
        run: python3 scripts/bench_results.py merge "$RUNNER_TEMP"/bench-slices/*.json --output "$RUNNER_TEMP/results.json" --git-sha "$GITHUB_SHA"
      - name: Update baseline branch
        env:
          BASELINE_DIR: ${{ runner.temp }}/bench-data
          BASELINE_LABEL: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git worktree add --detach "$BASELINE_DIR"
          for attempt in 1 2 3; do
            if git -C "$BASELINE_DIR" fetch --depth=1 origin bench-data; then
              git -C "$BASELINE_DIR" checkout -B bench-data FETCH_HEAD
            else
              git -C "$BASELINE_DIR" checkout --orphan "bench-data-$attempt"
              git -C "$BASELINE_DIR" rm -rf .
            fi
            cp "$RUNNER_TEMP/results.json" "$BASELINE_DIR/$GITHUB_SHA.json"
            git -C "$BASELINE_DIR" add "$GITHUB_SHA.json"
            latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [ "$BASELINE_LABEL" = "$latest_release" ]; then
              printf '%s\n' "$GITHUB_SHA" > "$BASELINE_DIR/latest"
              printf '%s\n' "$BASELINE_LABEL" > "$BASELINE_DIR/latest-release"
              git -C "$BASELINE_DIR" add latest latest-release
            fi
            if git -C "$BASELINE_DIR" diff --cached --quiet; then
              exit 0
            fi
            git -C "$BASELINE_DIR" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "bench: $GITHUB_SHA"
            if git -C "$BASELINE_DIR" push origin HEAD:bench-data; then
              exit 0
            fi
          done
          exit 1

  compare:
    if: >-
      github.event_name == 'pull_request_target' && needs.bench.result == 'success' && needs.bench.outputs.complete == 'true'
    needs: [bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/bench-slices
          merge-multiple: true
      - name: Merge result slices
        run: python3 scripts/bench_results.py merge "$RUNNER_TEMP"/bench-slices/*.json --output "$RUNNER_TEMP/current.json" --git-sha "$(git rev-parse HEAD)"
      - name: Read baseline
        id: baseline
        run: |
          if ! git fetch --depth=1 origin bench-data; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! baseline_sha=$(git show FETCH_HEAD:latest 2>/dev/null) \
            || ! git show "FETCH_HEAD:$baseline_sha.json" > "$RUNNER_TEMP/baseline.json"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          baseline_release=$(git show FETCH_HEAD:latest-release 2>/dev/null || printf 'unknown')
          git cat-file -e "$baseline_sha^{commit}" 2>/dev/null || git fetch origin "$baseline_sha"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "release=$baseline_release" >> "$GITHUB_OUTPUT"
      - name: Compare with baseline
        if: steps.baseline.outputs.available == 'true'
        env:
          BASELINE_LABEL: ${{ steps.baseline.outputs.release }}
        run: >-
          python3 scripts/bench_results.py compare --current "$RUNNER_TEMP/current.json" --baseline "$RUNNER_TEMP/baseline.json" --output "$RUNNER_TEMP/comparison.md" --baseline-label "$BASELINE_LABEL" --check-ir-pins --baseline-tree "${{ steps.baseline.outputs.sha }}" --current-tree "${{ github.event.pull_request.head.sha }}"
      - name: Compare without baseline
        if: steps.baseline.outputs.available != 'true'
        run: python3 scripts/bench_results.py compare --current "$RUNNER_TEMP/current.json" --output "$RUNNER_TEMP/comparison.md"
      - name: Prepare comparison artifact
        run: printf '%s\n' "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/pr-number"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-comparison
          path: |
            ${{ runner.temp }}/comparison.md
            ${{ runner.temp }}/pr-number
          if-no-files-found: error
