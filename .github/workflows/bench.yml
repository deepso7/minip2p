name: Bench

on:
  release:
    types: [published]
  pull_request_target:
    branches: [main]
    types: [labeled]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to measure (default branch when empty)
        required: false
        default: ""
      base:
        description: Also measure the merge-base of `ref` with this branch or commit, and compare the two as a PR run does
        required: false
        default: ""
      baseline:
        description: Record the result as the release baseline of `ref`, a published stable `v*` release tag
        type: boolean
        default: false
      sweep:
        description: Emulated-link window sweeps to run instead of the benchmarks (scripts/rtt-sweep.sh names, space-separated, or `all`)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.label.name == 'bench' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  AWS_REGION: ${{ vars.AWS_BENCH_REGION || 'ap-south-1' }}
  AB_RUN: ${{ github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.base != '') }}

jobs:
  start-runner:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch' || (github.event.label.name == 'bench' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'aws-bench' || 'aws-bench-unattended' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      authorized: ${{ steps.label.outputs.authorized }}
    steps:
      - name: Take bench label
        id: label
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/bench" >/dev/null || true
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          if [[ "$permission" != admin && "$permission" != write ]]; then
            echo "$SENDER has $permission access; only writers can start a bench" >&2
            exit 1
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Check dispatch inputs
        if: github.event_name == 'workflow_dispatch' && inputs.base != '' && (inputs.baseline || inputs.sweep != '')
        run: |
          echo "a run with base set compares two trees; it cannot also record a baseline or sweep" >&2
          exit 1
      - name: Check baseline tag
        if: github.event_name == 'workflow_dispatch' && inputs.baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP: ${{ inputs.sweep }}
          TAG: ${{ inputs.ref }}
        run: |
          if [[ "$TAG" != v* || -n "$SWEEP" ]]; then
            echo "a baseline run needs ref set to a v* release tag and no sweep" >&2
            exit 1
          fi
          prerelease=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease)
          if [ "$prerelease" != false ]; then
            echo "$TAG is a prerelease, not a stable release" >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BENCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Start bench runner
        env:
          AWS_BENCH_INSTANCE_ID: ${{ vars.AWS_BENCH_INSTANCE_ID }}
        run: scripts/start-bench-runner.sh

  bench:
    if: github.event_name != 'schedule'
    needs: start-runner
    runs-on: [self-hosted, linux, x64, minip2p-bench]
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      complete: ${{ steps.result.outputs.complete }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Check out benchmark source
        if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.ref != '')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || inputs.baseline && format('refs/tags/{0}', inputs.ref) || inputs.ref }}
          path: bench-source
          persist-credentials: false
      - name: Resolve benchmark source
        id: source
        env:
          SOURCE_DIR: ${{ (github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.ref != '')) && 'bench-source' || '.' }}
        run: |
          echo "dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$SOURCE_DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve merge-base
        id: merge-base
        if: env.AB_RUN == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base }}
          HEAD_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$BASE_REF...$HEAD_SHA?per_page=1" \
            | jq -er .merge_base_commit.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out merge-base
        if: env.AB_RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.merge-base.outputs.sha }}
          path: bench-base
          persist-credentials: false
      - name: Measure
        id: measure
        env:
          BENCH_GIT_SHA: ${{ steps.source.outputs.sha }}
          BENCH_SWEEP: ${{ inputs.sweep }}
          BENCH_CONTEXT: ${{ steps.source.outputs.dir }}
          BENCH_BASE_CONTEXT: ${{ env.AB_RUN == 'true' && 'bench-base' || '' }}
          BENCH_BASE_GIT_SHA: ${{ steps.merge-base.outputs.sha }}
        run: exec scripts/run-bench-container.sh
      - name: Prepare result slice
        id: result
        if: always()
        env:
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
          BENCH_GIT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p target/bench-artifacts
          if [ "$AB_RUN" = true ]; then
            exit 0
          fi
          complete=false
          if [ "$MEASURE_OUTCOME" = success ] && python3 scripts/bench_results.py merge target/bench-artifacts/current.json --output target/bench-artifacts/current.json --git-sha "$BENCH_GIT_SHA"; then
            complete=true
          else
            jq -n --arg sha "$BENCH_GIT_SHA" '{schema_version: 1, git_sha: $sha, rows: []}' > target/bench-artifacts/current.json
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - name: Compare
        id: compare
        if: env.AB_RUN == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base }}
          HEAD_DIR: ${{ steps.source.outputs.dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p target/bench-comparison
          python3 scripts/bench_results.py compare --base target/bench-artifacts/base.json --head target/bench-artifacts/head.json \
            --base-source bench-base --head-source "$HEAD_DIR" --base-ref "$BASE_REF" --run-url "$RUN_URL" \
            --output target/bench-comparison/comparison.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: target/bench-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.compare.outcome == 'success'
        with:
          name: bench-comparison
          path: target/bench-comparison/
          if-no-files-found: error

  comment:
    if: >-
      always() && github.event_name == 'pull_request_target' && needs.start-runner.outputs.authorized == 'true' && needs.bench.result != 'cancelled'
    needs: [start-runner, bench]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download comparison
        if: needs.bench.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-comparison
          path: ${{ runner.temp }}/bench-comparison
      - name: Upsert sticky comment
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/bench-comparison
          BENCH_RESULT: ${{ needs.bench.result }}
          START_RESULT: ${{ needs.start-runner.result }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET: ${{ runner.temp }}/bench-comment.md
        run: |
          set -euo pipefail
          existing_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            | jq --slurp '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- bench-comment -->")))][0] // {}')
          comment_id=$(jq -r '.id // empty' <<<"$existing_json")
          existing_body=$(jq -r '.body // empty' <<<"$existing_json")
          previous_body=$(printf '%s\n' "$existing_body" | sed \
            -e '/^<!-- bench-comment -->$/d' \
            -e '/^<!-- bench-status-start -->$/,/^<!-- bench-status-end -->$/d')

          conclusion="$BENCH_RESULT"
          if [ "$START_RESULT" != success ]; then
            conclusion="$START_RESULT"
          fi
          comparison=''
          if [ "$conclusion" = success ]; then
            test -s "$ARTIFACT_DIR/comparison.md"
            comparison=$(sed '/^<!-- bench-comment -->$/d' "$ARTIFACT_DIR/comparison.md")
          fi

          actual_head_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            if grep -qF -- "- Head: \`${actual_head_sha:0:12}\`" <<<"$previous_body"; then
              echo "the comment already compares the current head ${actual_head_sha:0:12}; keeping it" >&2
              exit 0
            fi
            below=${comparison:-$previous_body}
            {
              printf '%s\n' '<!-- bench-comment -->'
              printf '%s\n' '<!-- bench-status-start -->'
              printf '> [!WARNING]\n'
              printf '> The benchmark run for `%s` ([%s](%s)) finished after the PR moved to `%s`. Add the `bench` label again to measure the current head.' \
                "${EXPECTED_HEAD_SHA:0:12}" "$conclusion" "$RUN_URL" "${actual_head_sha:0:12}"
              if [ -n "$comparison" ]; then
                printf ' The comparison below is from that run.'
              elif [ -n "${below//[[:space:]]/}" ]; then
                printf ' The comparison below is from the last successful run.'
              fi
              printf '\n%s\n\n' '<!-- bench-status-end -->'
              if [ -n "${below//[[:space:]]/}" ]; then
                printf '%s\n' "$below"
              fi
            } > "$TARGET"
          elif [ -n "$comparison" ]; then
            cp "$ARTIFACT_DIR/comparison.md" "$TARGET"
          else
            {
              printf '%s\n' '<!-- bench-comment -->'
              printf '%s\n' '<!-- bench-status-start -->'
              printf '> [!WARNING]\n'
              if [ -n "${previous_body//[[:space:]]/}" ]; then
                previous=' The comparison below is from the last successful run.'
              else
                previous=''
              fi
              printf '> Benchmark run [%s](%s).%s To retry, use **Re-run all jobs**: re-running only the failed job does not wake the stopped bench instance.\n' \
                "$conclusion" "$RUN_URL" "$previous"
              printf '%s\n\n' '<!-- bench-status-end -->'
              if [ -n "$previous" ]; then
                printf '%s\n' "$previous_body"
              fi
            } > "$TARGET"
          fi

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F "body=@$TARGET"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$TARGET"
          fi

  keepalive:
    if: github.event_name == 'schedule'
    needs: start-runner
    runs-on: [self-hosted, linux, x64, minip2p-bench]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: "true"

  baseline:
    if: >-
      needs.bench.outputs.complete == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.baseline))
    needs: [bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASELINE_SHA: ${{ needs.bench.outputs.sha }}
      BASELINE_LABEL: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/bench-slices
          merge-multiple: true
      - name: Merge result slices
        run: python3 scripts/bench_results.py merge "$RUNNER_TEMP"/bench-slices/*.json --output "$RUNNER_TEMP/results.json" --git-sha "$BASELINE_SHA"
      - name: Update baseline branch
        env:
          BASELINE_DIR: ${{ runner.temp }}/bench-data
          GH_TOKEN: ${{ github.token }}
        run: |
          git worktree add --detach "$BASELINE_DIR"
          for attempt in 1 2 3; do
            if git -C "$BASELINE_DIR" fetch --depth=1 origin bench-data; then
              git -C "$BASELINE_DIR" checkout -B bench-data FETCH_HEAD
            else
              git -C "$BASELINE_DIR" checkout --orphan "bench-data-$attempt"
              git -C "$BASELINE_DIR" rm -rf .
            fi
            cp "$RUNNER_TEMP/results.json" "$BASELINE_DIR/$BASELINE_SHA.json"
            git -C "$BASELINE_DIR" add "$BASELINE_SHA.json"
            latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [ "$BASELINE_LABEL" = "$latest_release" ]; then
              printf '%s\n' "$BASELINE_SHA" > "$BASELINE_DIR/latest"
              printf '%s\n' "$BASELINE_LABEL" > "$BASELINE_DIR/latest-release"
              git -C "$BASELINE_DIR" add latest latest-release
            fi
            if git -C "$BASELINE_DIR" diff --cached --quiet; then
              exit 0
            fi
            git -C "$BASELINE_DIR" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "bench: $BASELINE_SHA"
            if git -C "$BASELINE_DIR" push origin HEAD:bench-data; then
              exit 0
            fi
          done
          exit 1
