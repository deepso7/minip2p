name: React Native native builds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: bindings-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.18.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36 and NDK r28c
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm rn:android
      - name: Validate Android ELF alignment and allocator hooks
        run: node react-native/scripts/check-android-elf.mjs
      - run: pnpm example prebuild
      - name: Build both Android ABIs
        working-directory: bindings/ts/react-native/example/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Validate 16 KiB APK zip alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 \
            react-native/example/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Monitor native sizes
        run: node react-native/scripts/check-native-size.mjs android
      - uses: actions/upload-artifact@v6
        with:
          name: minip2p-android-debug
          path: bindings/ts/react-native/example/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.18.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm rn:ios
      - name: Validate XCFramework slices
        run: |
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64/libminip2p_ffi.a
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64-simulator/libminip2p_ffi.a
      - name: Monitor native sizes
        run: node react-native/scripts/check-native-size.mjs ios
      - uses: actions/upload-artifact@v6
        with:
          name: minip2p-ios-xcframework
          path: bindings/ts/react-native/build/Minip2pFfi.xcframework
          if-no-files-found: error
