name: Native binding builds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: bindings-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-native:
    name: Build and test Node addon (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.24.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build addon
        shell: bash
        run: pnpm --filter @minip2p/node native:build:target --target ${{ matrix.target }} -- --locked
      - name: Build relay fixture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked -p minip2p-relay-server-example
          relay=minip2p-relay
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            relay+=.exe
          fi
          mkdir -p ../../target/debug
          cp "../../target/release/$relay" "../../target/debug/$relay"
      - shell: bash
        run: |
          pnpm --filter @minip2p/node exec vitest run \
            --config ../vitest.config.ts \
            --root . \
            --no-file-parallelism

  node-musl:
    name: Build and test Node addon (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Build addon
        env:
          NAPI_BUILD_IMAGE: ghcr.io/napi-rs/napi-rs/nodejs-rust@sha256:caac2d1b9194eada0c69e669e72763869701351d8957ab805cc45a43999d8be2
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm \
            --env TARGET \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work/bindings/ts \
            "$NAPI_BUILD_IMAGE" \
            bash -lc '
              set -euo pipefail
              apk add --no-cache --upgrade \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.23/main \
                clang20-libclang=20.1.8-r1 \
                nodejs npm
              export PATH=/usr/bin:$PATH
              npm install --global --prefix /opt/pnpm pnpm@11.24.0
              export PATH=/opt/pnpm/bin:/usr/bin:$PATH
              rustup toolchain install 1.91 --profile minimal
              rustup default 1.91
              export CC=gcc
              export CXX=g++
              export LIBCLANG_PATH=/usr/lib/llvm20/lib
              export RUSTFLAGS="-C target-feature=-crt-static"
              cargo build --release --locked --manifest-path ../../crates/nodejs/Cargo.toml
              case "$TARGET" in
                x86_64-unknown-linux-musl) output=minip2p.linux-x64-musl.node ;;
                aarch64-unknown-linux-musl) output=minip2p.linux-arm64-musl.node ;;
                *) echo "Unsupported musl target: $TARGET" >&2; exit 1 ;;
              esac
              install ../../target/release/libminip2p_nodejs.so "node/$output"
              cargo build --release --locked -p minip2p-relay-server-example
              mkdir -p ../../target/debug
              cp ../../target/release/minip2p-relay ../../target/debug/minip2p-relay
              pnpm install --frozen-lockfile
              pnpm --filter @minip2p/node exec vitest run \
                --config ../vitest.config.ts \
                --root . \
                --no-file-parallelism
            '

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.18.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 and NDK r28c
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm rn:android
      - name: Validate Android ELF alignment and allocator hooks
        run: node react-native/scripts/check-android-elf.mjs
      - run: pnpm example prebuild
      - name: Build both Android ABIs
        working-directory: bindings/ts/react-native/example/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Validate 16 KiB APK zip alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 \
            react-native/example/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Monitor native sizes
        run: node react-native/scripts/check-native-size.mjs android
      - uses: actions/upload-artifact@v7
        with:
          name: minip2p-android-debug
          path: bindings/ts/react-native/example/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.18.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm rn:ios
      - name: Validate XCFramework slices
        run: |
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64/libminip2p_ffi.a
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64-simulator/libminip2p_ffi.a
      - name: Monitor native sizes
        run: node react-native/scripts/check-native-size.mjs ios
      - uses: actions/upload-artifact@v7
        with:
          name: minip2p-ios-xcframework
          path: bindings/ts/react-native/build/Minip2pFfi.xcframework
          if-no-files-found: error
