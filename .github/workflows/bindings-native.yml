name: Native binding builds

on:
  workflow_dispatch:
    inputs:
      include_mobile:
        description: Also build the React Native Android and iOS artifacts
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: bindings-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-native:
    name: Build and test Node addon (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}
          shared-key: node-native
          save-cache: always
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
          normalize-windows-patches: "true"
      - name: Build addon
        shell: bash
        run: pnpm --filter @minip2p/node native:build:target --target ${{ matrix.target }} -- --locked
      - name: Build relay fixture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked -p minip2p-relay-server-example
          relay=minip2p-relay
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            relay+=.exe
          fi
          mkdir -p ../../target/debug
          cp "../../target/release/$relay" "../../target/debug/$relay"
      - shell: bash
        run: pnpm --filter @minip2p/node exec vitest run

  node-musl:
    name: Build and test Node addon (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test musl addon
        run: scripts/build-node-musl.sh "${{ matrix.target }}" --test

  android:
    if: github.event_name == 'schedule' || inputs.include_mobile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-android
        with:
          java: "true"
          sdk-platform: "true"
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
          shared-key: android
          save-cache: always
          cargo-ndk: "true"
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
      - uses: ./.github/actions/run-ubrn
        with:
          rust-cachekey: ${{ steps.rust.outputs.cachekey }}
          working-directory: bindings/ts
          command: pnpm --workspace-root rn:android
      - name: Validate Android ELF alignment and allocator hooks
        run: node react-native/scripts/check-android-elf.mjs
      - run: pnpm --workspace-root example prebuild
      - name: Restore Gradle cache
        id: gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'examples/react-native/package.json', 'bindings/ts/react-native/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build both Android ABIs
        working-directory: examples/react-native/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Save Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}
      - name: Validate 16 KiB APK zip alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 \
            ../../examples/react-native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Monitor native sizes
        run: node react-native/scripts/check-native-size.mjs android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minip2p-android-debug
          path: examples/react-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    if: github.event_name == 'schedule' || inputs.include_mobile
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          shared-key: ios
          save-cache: always
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
      - uses: ./.github/actions/run-ubrn
        with:
          rust-cachekey: ${{ steps.rust.outputs.cachekey }}
          working-directory: bindings/ts
          command: pnpm --workspace-root rn:ios
      - name: Validate XCFramework slices
        run: |
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64/libminip2p_ffi.a
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64-simulator/libminip2p_ffi.a
      - name: Monitor native sizes
        run: node react-native/scripts/check-native-size.mjs ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minip2p-ios-xcframework
          path: bindings/ts/react-native/build/Minip2pFfi.xcframework
          if-no-files-found: error
