name: TypeScript bindings

on:
  push:
    branches: [main]
    paths:
      - "bindings/**"
      - "crates/ffi/**"
      - "crates/ffi-core/**"
      - "crates/nodejs/**"
      - ".github/workflows/bindings.yml"
      - ".github/workflows/bindings-native.yml"
  pull_request:
    paths:
      - "bindings/**"
      - "crates/ffi/**"
      - "crates/ffi-core/**"
      - "crates/nodejs/**"
      - ".github/workflows/bindings.yml"
      - ".github/workflows/bindings-native.yml"

permissions:
  contents: read

# Matches ci.yml: a superseded PR run is checking a commit that no longer
# exists, while main keeps a full result for every merged commit.
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-and-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.18.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @minip2p/node native:build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @minip2p/react-native test:built
      - run: pnpm rn:generate
      - name: Generated files are current
        run: test -z "$(git status --porcelain)"
