name: TypeScript bindings

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Matches ci.yml: a superseded PR run is checking a commit that no longer
# exists, while main keeps a full result for every merged commit.
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-and-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # publish.yml's package-typescript restores this cache.
          shared-key: generated-and-typescript
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-bindgen
        # Must match crates/web's pinned wasm-bindgen. A no-op when the cache
        # restored ~/.cargo/bin.
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: pnpm install --frozen-lockfile
      # The ubrn bin `cargo run`s its own CLI in node_modules, a ~1.5 min build
      # that every fresh install repeats. The key pins the toolchain, ubrn
      # version and our patch, so the build is exact; Cargo would still rebuild
      # ubrn's own crates because the install gave their sources new mtimes,
      # hence the backdating. No restore-keys: backdated sources must never
      # meet a target built from other ones. bindings-native.yml and
      # publish.yml repeat these steps.
      - name: Restore ubrn CLI build
        id: ubrn
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/uniffi-bindgen-react-native/target
            node_modules/uniffi-bindgen-react-native/Cargo.lock
          key: ubrn-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('node_modules/uniffi-bindgen-react-native/package.json', 'bindings/ts/react-native/patches/*.patch') }}
      - name: Backdate ubrn sources
        if: steps.ubrn.outputs.cache-hit == 'true'
        working-directory: node_modules/uniffi-bindgen-react-native
        run: find . -path ./target -prune -o -exec touch -d 2000-01-01T00:00:00Z {} +
      - run: pnpm test:workflows
      - run: pnpm typecheck
      - run: pnpm --filter @minip2p/node native:build
      # Builds the web wasm (its pretest) before its tests.
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build:bindings
      - run: pnpm --filter @minip2p/react-native test:built
      - run: pnpm rn:generate
      - name: Save ubrn CLI build
        if: github.ref == 'refs/heads/main' && steps.ubrn.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/uniffi-bindgen-react-native/target
            node_modules/uniffi-bindgen-react-native/Cargo.lock
          key: ${{ steps.ubrn.outputs.cache-primary-key }}
      - name: Generated files are current
        run: test -z "$(git status --porcelain)"
      # Chromium and Firefox both pass headless with serverCertificateHashes,
      # so both are required.
      - name: Install Playwright browsers
        run: pnpm --filter @minip2p/web exec playwright install --with-deps chromium firefox
      - name: Browser e2e
        run: pnpm --filter @minip2p/web test:e2e
