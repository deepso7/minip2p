name: TypeScript bindings

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Matches ci.yml: a superseded PR run is checking a commit that no longer
# exists, while main keeps a full result for every merged commit.
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-and-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workflows
      - run: pnpm typecheck
      - run: pnpm --filter @minip2p/node native:build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build:bindings
      - run: pnpm --filter @minip2p/react-native test:built
      - run: pnpm rn:generate
      - name: Generated files are current
        run: test -z "$(git status --porcelain)"
