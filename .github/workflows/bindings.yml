name: TypeScript bindings

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Matches ci.yml: a superseded PR run is checking a commit that no longer
# exists, while main keeps a full result for every merged commit.
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-and-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "12.5.1"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workflows
      - run: pnpm typecheck
      - run: pnpm --filter @minip2p/node native:build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build:bindings
      - run: pnpm --filter @minip2p/react-native test:built
      - run: pnpm rn:generate
      - name: Generated files are current
        run: test -z "$(git status --porcelain)"
