name: TypeScript bindings

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Matches ci.yml: a superseded PR run is checking a commit that no longer
# exists, while main keeps a full result for every merged commit.
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-and-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wasm-bindgen
        # Must match crates/web's pinned wasm-bindgen.
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workflows
      - run: pnpm typecheck
      - run: pnpm --filter @minip2p/node native:build
      # Builds the web wasm (its pretest) before its tests.
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build:bindings
      - run: pnpm --filter @minip2p/react-native test:built
      - run: pnpm rn:generate
      - name: Generated files are current
        run: test -z "$(git status --porcelain)"
      # Chromium and Firefox both pass headless with serverCertificateHashes,
      # so both are required.
      - name: Install Playwright browsers
        run: pnpm --filter @minip2p/web exec playwright install --with-deps chromium firefox
      - name: Browser e2e
        run: pnpm --filter @minip2p/web test:e2e
