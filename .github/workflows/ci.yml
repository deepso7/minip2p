name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded PR run proves nothing: the commit it was checking is already
# gone. main is never cancelled, so every merged commit keeps a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Backtraces keep file and line, but builds skip full debuginfo: a cold
  # workspace test build is about a third faster and its target dir about half
  # the size, which keeps the shared Actions cache under its quota.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Pinned so a nextest release can't change test selection under us. Bump
  # deliberately, like the other pinned tools below.
  NEXTEST_VERSION: 0.9.143

jobs:
  docs-site:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blume's lastModified metadata reads page history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The snippets are their own workspaces; without this they rebuilt
          # from scratch on every run.
          workspaces: |
            docs/snippets/quickstart
            docs/snippets/custom-stream
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: scripts/test-relay-installer.sh
      - run: cargo check --manifest-path docs/snippets/quickstart/Cargo.toml
      - run: cargo check --manifest-path docs/snippets/custom-stream/Cargo.toml

  relay-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/test-relay-container.sh

  # Split from `test` so the two run on parallel runners. The feature matrix
  # grows with every portable backend, and a single serial job grew ~4x in a
  # month; keeping lint and test apart keeps that growth off the critical path.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
          # Real no_std target: a host check can't catch dependencies that
          # unconditionally link std. wasm32 is the browser build's target.
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PR runs restore main's cache but never save their own: per-branch
          # saves pushed the repo to the 10 GB ceiling, and the resulting
          # evictions cost more than the occasional cold PR build.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo check -p minip2p-rs --features relay-server
      - run: cargo check -p minip2p-rs --features nat,relay-server
      - run: cargo check -p minip2p-rs --features nat,relay-server,tcp
      - run: cargo check -p minip2p-rs --no-default-features --features std,tcp,relay-server
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/run-feature-matrix.sh clippy
      # --locked: fuzz/ has its own lockfile, which a PR cut before a version
      # bump can leave stale; fail here rather than let it land on main.
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo check --no-default-features --target thumbv7em-none-eabi -p minip2p-core -p minip2p-identity -p minip2p-transport -p minip2p-tls -p minip2p-secure-mux -p minip2p-smoltcp -p minip2p-tcp -p minip2p-circuit -p minip2p-identify -p minip2p-multistream-select -p minip2p-ping -p minip2p-pubsub -p minip2p-discovery -p minip2p-mdns -p minip2p-relay -p minip2p-relay-server -p minip2p-autonat -p minip2p-dcutr -p minip2p-swarm -p minip2p-nat -p minip2p-webtransport -p minip2p-rs
      - run: cargo check --no-default-features --features smoltcp --target thumbv7em-none-eabi -p minip2p-tcp -p minip2p-mdns -p minip2p-rs
      - run: cargo check --no-default-features --features smoltcp,pubsub --target thumbv7em-none-eabi -p minip2p-rs
      - run: cargo check --no-default-features --features portable-autonat --target thumbv7em-none-eabi -p minip2p-rs
      - run: cargo check --no-default-features --features portable-relay --target thumbv7em-none-eabi -p minip2p-rs
      - run: cargo check --no-default-features --features portable-relay,pubsub --target thumbv7em-none-eabi -p minip2p-rs
      - run: cargo check --no-default-features --features portable-mdns,pubsub,portable-relay --target thumbv7em-none-eabi -p minip2p-rs
      - run: cargo check --no-default-features --features smoltcp,portable-relay,pubsub --target thumbv7em-none-eabi -p minip2p-rs
      # Mirrors `just check-wasm`.
      - run: cargo check --target wasm32-unknown-unknown -p minip2p-ffi-core --no-default-features --features serde
      - run: cargo check --target wasm32-unknown-unknown -p minip2p-rs --no-default-features --features pubsub
      - run: cargo doc --workspace --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p minip2p-relay-server --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p minip2p-rs --features nat,pubsub,discovery,mdns,tcp,relay-server --no-deps
      - run: cargo doc -p minip2p-tcp --features smoltcp --no-deps
      - run: cargo doc -p minip2p-mdns --features smoltcp --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features smoltcp --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features smoltcp,pubsub --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features portable-autonat --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features portable-relay --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features smoltcp,portable-relay,pubsub --no-deps
      - run: cargo bench -p minip2p-core --bench multiaddr --no-run
      - run: cargo metadata --no-deps --format-version 1 | jq -e '[.packages[] | select(.publish != []) | .readme != null] | all'
      - run: cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name' | while read package; do cargo package -p "$package" --list | grep -q '^README.md$' || exit 1; done
      - run: cargo metadata --no-deps --format-version 1 | jq -e '.packages[] | select(.name == "minip2p-rs") | .features["relay-server"] == ["std", "dep:minip2p-relay-server"]'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # nextest runs every test as its own process across all binaries at once.
      # `cargo test` runs binaries one at a time, so the ffi relay test held the
      # runner alone for 40s waiting on relay-loss detection — a wait that costs
      # under a second on a dev box, so it only ever showed up here.
      - name: Install cargo-nextest
        run: curl -sSLf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "$HOME/.cargo/bin"
      - run: cargo nextest run --workspace
      - run: scripts/run-feature-matrix.sh test
      # nextest does not run doctests, and `--workspace --doc` only builds
      # default features, so a doctest behind a feature gate needs its own line
      # here. Today that is just SmoltcpTcpProvider; add a line when there are
      # more.
      - run: cargo test --workspace --doc
      - run: cargo test -p minip2p-tcp --features smoltcp --doc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable; 1.91 (workspace rust-version) via the toolchain input
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      # Pinned so a broken upstream nightly can't fail every PR and the
      # rust-cache key stays stable. Bump deliberately.
      NIGHTLY_TOOLCHAIN: nightly-2026-09-04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable; installs the nightly toolchain below via the toolchain input
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Swatinem/rust-cache does not cache ~/.cargo/bin, so cargo-fuzz is
      # rebuilt whenever the runner image ships without it. Pinned --version +
      # --locked keeps the tool and its dependency tree fully reproducible (same
      # intent as the pinned nightly above); a bare --locked would still float
      # to whatever cargo-fuzz release is newest. Bump deliberately.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +$NIGHTLY_TOOLCHAIN fuzz run wire_inputs -- -max_total_time=30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
