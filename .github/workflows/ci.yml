name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded PR run proves nothing: the commit it was checking is already
# gone. main is never cancelled, so every merged commit keeps a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so a nextest release can't change test selection under us. Bump
  # deliberately, like the other pinned tools below.
  NEXTEST_VERSION: 0.9.143

jobs:
  docs-site:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Blume's lastModified metadata reads page history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.10.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
        with:
          # The snippets are their own workspaces; without this they rebuilt
          # from scratch on every run.
          workspaces: |
            docs/snippets/quickstart
            docs/snippets/custom-stream
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm run check
        working-directory: docs
      - run: cargo check --manifest-path docs/snippets/quickstart/Cargo.toml
      - run: cargo check --manifest-path docs/snippets/custom-stream/Cargo.toml

  # Split from `test` so the two run on parallel runners. The feature matrix
  # grows with every portable backend, and a single serial job grew ~4x in a
  # month; keeping lint and test apart keeps that growth off the critical path.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt
          # Real no_std target: a host check can't catch dependencies that
          # unconditionally link std.
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          # PR runs restore main's cache but never save their own: per-branch
          # saves pushed the repo to the 10 GB ceiling, and the resulting
          # evictions cost more than the occasional cold PR build.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo check -p minip2p-rs --features relay-server
      - run: cargo check -p minip2p-rs --features nat,relay-server
      - run: cargo check -p minip2p-rs --features nat,relay-server,tcp
      - run: cargo check -p minip2p-rs --no-default-features --features std,tcp,relay-server
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features nat --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features nat,pubsub --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features discovery --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features mdns --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features discovery,mdns --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features relay-server --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features nat,relay-server --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features nat,relay-server,tcp --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --no-default-features --features std,tcp,relay-server --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features tcp --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --no-default-features --features std,tcp --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --no-default-features --features smoltcp --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --no-default-features --features smoltcp,pubsub --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --no-default-features --features portable-autonat --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --no-default-features --features portable-relay --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-rs --features discovery,mdns,tcp --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-tcp --features smoltcp --all-targets -- -D warnings
      - run: cargo clippy -p minip2p-mdns --features smoltcp --all-targets -- -D warnings
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --no-default-features --target thumbv7em-none-eabi -p minip2p-core -p minip2p-platform -p minip2p-identity -p minip2p-transport -p minip2p-tls -p minip2p-noise -p minip2p-yamux -p minip2p-secure-mux -p minip2p-smoltcp -p minip2p-tcp -p minip2p-circuit -p minip2p-identify -p minip2p-multistream-select -p minip2p-ping -p minip2p-pubsub -p minip2p-discovery -p minip2p-mdns -p minip2p-relay -p minip2p-relay-server -p minip2p-autonat -p minip2p-dcutr -p minip2p-swarm -p minip2p-nat -p minip2p-rs
      - run: cargo check --no-default-features --features smoltcp --target thumbv7em-none-eabi -p minip2p-tcp -p minip2p-mdns -p minip2p-rs
      - run: cargo check --no-default-features --features smoltcp,pubsub --target thumbv7em-none-eabi -p minip2p-rs
      - run: cargo check --no-default-features --features portable-autonat --target thumbv7em-none-eabi -p minip2p-rs
      - run: cargo check --no-default-features --features portable-relay --target thumbv7em-none-eabi -p minip2p-rs
      - run: cargo doc --workspace --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p minip2p-relay-server --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p minip2p-rs --features nat,pubsub,discovery,mdns,tcp,relay-server --no-deps
      - run: cargo doc -p minip2p-tcp --features smoltcp --no-deps
      - run: cargo doc -p minip2p-mdns --features smoltcp --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features smoltcp --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features smoltcp,pubsub --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features portable-autonat --no-deps
      - run: cargo doc -p minip2p-rs --no-default-features --features portable-relay --no-deps
      - run: cargo bench -p minip2p-core --bench multiaddr --no-run
      - run: just package-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # nextest runs every test as its own process across all binaries at once.
      # `cargo test` runs binaries one at a time, so the ffi relay test held the
      # runner alone for 40s waiting on relay-loss detection — a wait that costs
      # under a second on a dev box, so it only ever showed up here.
      - name: Install cargo-nextest
        run: curl -sSLf "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar zxf - -C "$HOME/.cargo/bin"
      - run: cargo nextest run --workspace
      - run: cargo nextest run --profile variants -p minip2p-rs --features nat
      - run: cargo nextest run --profile variants -p minip2p-rs --features pubsub
      - run: cargo nextest run --profile variants -p minip2p-rs --features nat,pubsub
      - run: cargo nextest run --profile variants -p minip2p-rs --features discovery
      - run: cargo nextest run --profile variants -p minip2p-rs --features mdns
      - run: cargo nextest run --profile variants -p minip2p-rs --features discovery,mdns
      - run: cargo nextest run --profile variants -p minip2p-rs --features relay-server
      - run: cargo nextest run --profile variants -p minip2p-rs --features nat,relay-server
      - run: cargo nextest run --profile variants -p minip2p-rs --features nat,relay-server,tcp
      - run: cargo nextest run --profile variants -p minip2p-rs --no-default-features --features std,tcp,relay-server
      - run: cargo nextest run --profile variants -p minip2p-rs --features tcp
      - run: cargo nextest run --profile variants -p minip2p-rs --no-default-features --features std,tcp
      - run: cargo nextest run --profile variants -p minip2p-rs --features discovery,mdns,tcp
      - run: cargo nextest run --profile variants -p minip2p-rs --no-default-features --features smoltcp
      - run: cargo nextest run --profile variants -p minip2p-rs --no-default-features --features smoltcp,pubsub
      - run: cargo nextest run --profile variants -p minip2p-rs --no-default-features --features portable-autonat
      - run: cargo nextest run --profile variants -p minip2p-rs --no-default-features --features portable-relay
      - run: cargo nextest run --profile variants -p minip2p-tcp --features smoltcp
      - run: cargo nextest run --profile variants -p minip2p-mdns --features smoltcp
      # nextest does not run doctests, and `--workspace --doc` only builds
      # default features, so a doctest behind a feature gate needs its own line
      # here. Today that is just SmoltcpTcpProvider; add a line when there are
      # more.
      - run: cargo test --workspace --doc
      - run: cargo test -p minip2p-tcp --features smoltcp --doc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable # 1.91 (workspace rust-version) via the toolchain input
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      # Pinned so a broken upstream nightly can't fail every PR and the
      # rust-cache key stays stable. Bump deliberately.
      NIGHTLY_TOOLCHAIN: nightly-2026-07-01
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable # installs the nightly toolchain below via the toolchain input
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Swatinem/rust-cache does not cache ~/.cargo/bin, so cargo-fuzz is
      # rebuilt whenever the runner image ships without it. Pinned --version +
      # --locked keeps the tool and its dependency tree fully reproducible (same
      # intent as the pinned nightly above); a bare --locked would still float
      # to whatever cargo-fuzz release is newest. Bump deliberately.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +$NIGHTLY_TOOLCHAIN fuzz run wire_inputs -- -max_total_time=30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
