name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.affected.outputs.full }}
      rust_fmt: ${{ steps.affected.outputs.rust_fmt }}
      fuzz_fmt: ${{ steps.affected.outputs.fuzz_fmt }}
      rust_packages: ${{ steps.affected.outputs.rust_packages }}
      rust_has_packages: ${{ steps.affected.outputs.rust_has_packages }}
      matrix_clippy_rows: ${{ steps.affected.outputs.matrix_clippy_rows }}
      matrix_test_rows: ${{ steps.affected.outputs.matrix_test_rows }}
      check_lib_rows: ${{ steps.affected.outputs.check_lib_rows }}
      fuzz_clippy: ${{ steps.affected.outputs.fuzz_clippy }}
      fuzz_smoke: ${{ steps.affected.outputs.fuzz_smoke }}
      check_nostd: ${{ steps.affected.outputs.check_nostd }}
      check_wasm: ${{ steps.affected.outputs.check_wasm }}
      check_docs: ${{ steps.affected.outputs.check_docs }}
      package_check: ${{ steps.affected.outputs.package_check }}
      doctest_workspace: ${{ steps.affected.outputs.doctest_workspace }}
      doctest_tcp_smoltcp: ${{ steps.affected.outputs.doctest_tcp_smoltcp }}
      msrv: ${{ steps.affected.outputs.msrv }}
      bench_targets: ${{ steps.affected.outputs.bench_targets }}
      bench_build: ${{ steps.affected.outputs.bench_build }}
      relay_container: ${{ steps.affected.outputs.relay_container }}
      relay_installer: ${{ steps.affected.outputs.relay_installer }}
      docs_site: ${{ steps.affected.outputs.docs_site }}
      docs_snippets_quickstart: ${{ steps.affected.outputs.docs_snippets_quickstart }}
      docs_snippets_custom_stream: ${{ steps.affected.outputs.docs_snippets_custom_stream }}
      ts_lint: ${{ steps.affected.outputs.ts_lint }}
      workflow_tests: ${{ steps.affected.outputs.workflow_tests }}
      script_tests: ${{ steps.affected.outputs.script_tests }}
      bindings_ts: ${{ steps.affected.outputs.bindings_ts }}
      bindings_ts_packages: ${{ steps.affected.outputs.bindings_ts_packages }}
      bindings_node_native: ${{ steps.affected.outputs.bindings_node_native }}
      bindings_rn_gen: ${{ steps.affected.outputs.bindings_rn_gen }}
      bindings_web: ${{ steps.affected.outputs.bindings_web }}
      bindings_web_e2e: ${{ steps.affected.outputs.bindings_web_e2e }}
      summary: ${{ steps.affected.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: affected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/affected.py --base HEAD^1 --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/affected.py --all --github-output "$GITHUB_OUTPUT"
          fi

  checks:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Comment ratchet
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/check-comments.py --base HEAD^1
          else
            python3 scripts/check-comments.py
          fi
      - name: Python script tests
        if: needs.plan.outputs.script_tests == 'true'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s bench -p 'test_*.py'
      - if: needs.plan.outputs.ts_lint == 'true' || needs.plan.outputs.workflow_tests == 'true'
        uses: ./.github/actions/setup-node
      - name: Lint and format check
        if: needs.plan.outputs.ts_lint == 'true'
        run: pnpm lint
      - name: Workflow contract tests
        if: needs.plan.outputs.workflow_tests == 'true'
        run: pnpm test:workflows

  lint:
    needs: plan
    if: >-
      needs.plan.outputs.rust_fmt == 'true' || needs.plan.outputs.fuzz_fmt == 'true' || needs.plan.outputs.rust_has_packages == 'true' || needs.plan.outputs.matrix_clippy_rows != '' || needs.plan.outputs.fuzz_clippy == 'true' || needs.plan.outputs.check_nostd == 'true' || needs.plan.outputs.check_wasm == 'true' || needs.plan.outputs.check_docs == 'true' || needs.plan.outputs.package_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy,rustfmt
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown
          shared-key: lint
      - if: needs.plan.outputs.rust_fmt == 'true'
        run: cargo fmt --all -- --check
      - if: needs.plan.outputs.fuzz_fmt == 'true'
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Library-only feature checks
        if: needs.plan.outputs.check_lib_rows != ''
        env:
          ROWS: ${{ needs.plan.outputs.check_lib_rows }}
        run: scripts/run-feature-matrix.sh check --rows "$ROWS"
      - name: Workspace clippy
        if: needs.plan.outputs.rust_has_packages == 'true'
        env:
          RUST_PACKAGES: ${{ needs.plan.outputs.rust_packages }}
        run: cargo clippy $RUST_PACKAGES --all-targets -- -D warnings
      - name: Feature-matrix clippy
        if: needs.plan.outputs.matrix_clippy_rows != ''
        env:
          ROWS: ${{ needs.plan.outputs.matrix_clippy_rows }}
        run: |
          if [ "$ROWS" = full ]; then
            scripts/run-feature-matrix.sh clippy full
          else
            scripts/run-feature-matrix.sh clippy --rows "$ROWS"
          fi
      - name: Fuzz clippy
        if: needs.plan.outputs.fuzz_clippy == 'true'
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - if: needs.plan.outputs.check_nostd == 'true'
        run: scripts/check-targets.sh nostd
      - if: needs.plan.outputs.check_wasm == 'true'
        run: scripts/check-targets.sh wasm
      - if: needs.plan.outputs.check_docs == 'true'
        run: scripts/check-targets.sh docs
      - if: needs.plan.outputs.package_check == 'true'
        run: scripts/check-targets.sh package-check

  test-workspace:
    needs: plan
    if: needs.plan.outputs.rust_has_packages == 'true' || needs.plan.outputs.doctest_tcp_smoltcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: test
          nextest: "true"
      - name: Workspace tests
        if: needs.plan.outputs.rust_has_packages == 'true'
        env:
          FULL: ${{ needs.plan.outputs.full }}
          RUST_PACKAGES: ${{ needs.plan.outputs.rust_packages }}
        run: |
          if [ "$FULL" = true ]; then
            cargo nextest run $RUST_PACKAGES
          else
            cargo nextest run --no-tests=pass $RUST_PACKAGES
          fi
      - name: Workspace doctests
        if: needs.plan.outputs.doctest_workspace == 'true'
        env:
          RUST_PACKAGES: ${{ needs.plan.outputs.rust_packages }}
        run: cargo test $RUST_PACKAGES --doc
      - name: Smoltcp doctests
        if: needs.plan.outputs.doctest_tcp_smoltcp == 'true'
        run: cargo test -p minip2p-tcp --features smoltcp --doc

  test-matrix:
    needs: plan
    if: needs.plan.outputs.matrix_test_rows != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: test-matrix
          nextest: "true"
      - name: Feature-matrix tests
        env:
          ROWS: ${{ needs.plan.outputs.matrix_test_rows }}
        run: |
          if [ "$ROWS" = ci ]; then
            scripts/run-feature-matrix.sh test ci
          else
            scripts/run-feature-matrix.sh test --rows "$ROWS"
          fi

  msrv:
    needs: plan
    if: needs.plan.outputs.msrv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          shared-key: msrv
      - env:
          RUST_PACKAGES: ${{ needs.plan.outputs.rust_packages }}
        run: cargo check $RUST_PACKAGES --all-targets

  bench-build:
    needs: plan
    if: needs.plan.outputs.bench_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: bench-build
      - run: python3 scripts/check-bench-ids.py
      - name: Build reachable benchmarks
        env:
          TARGETS: ${{ needs.plan.outputs.bench_targets }}
        run: |
          if [ "$TARGETS" = all ]; then
            scripts/build-benches.sh
          else
            scripts/build-benches.sh build --only "$TARGETS"
          fi

  fuzz-smoke:
    needs: plan
    if: needs.plan.outputs.fuzz_smoke == 'true'
    runs-on: ubuntu-latest
    env:
      NIGHTLY_TOOLCHAIN: nightly-2026-09-04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          workspaces: fuzz
          shared-key: fuzz-smoke
          cargo-fuzz: "true"
      - run: cargo +$NIGHTLY_TOOLCHAIN fuzz run wire_inputs -- -max_total_time=30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  relay-container:
    needs: plan
    if: needs.plan.outputs.relay_container == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/test-relay-container.sh

  docs-site:
    needs: plan
    if: >-
      needs.plan.outputs.docs_site == 'true' || needs.plan.outputs.relay_installer == 'true' || needs.plan.outputs.docs_snippets_quickstart == 'true' || needs.plan.outputs.docs_snippets_custom_stream == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ needs.plan.outputs.docs_site == 'true' && '0' || '1' }}
      - if: needs.plan.outputs.docs_site == 'true'
        uses: ./.github/actions/setup-node
      - if: needs.plan.outputs.docs_snippets_quickstart == 'true' || needs.plan.outputs.docs_snippets_custom_stream == 'true'
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          shared-key: docs-site
          workspaces: |
            docs/snippets/quickstart
            docs/snippets/custom-stream
      - if: needs.plan.outputs.docs_site == 'true'
        run: pnpm docs:check
      - if: needs.plan.outputs.relay_installer == 'true'
        run: scripts/test-relay-installer.sh
      - if: needs.plan.outputs.docs_snippets_quickstart == 'true'
        run: cargo check --manifest-path docs/snippets/quickstart/Cargo.toml
      - if: needs.plan.outputs.docs_snippets_custom_stream == 'true'
        run: cargo check --manifest-path docs/snippets/custom-stream/Cargo.toml

  ts-bindings:
    needs: plan
    if: needs.plan.outputs.bindings_web_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: generated-and-typescript
          wasm-bindgen: "true"
      - run: pnpm typecheck
      - run: pnpm --filter @minip2p/node native:build
      - name: Run Node and Web tests
        env:
          TS_PACKAGES: ${{ needs.plan.outputs.bindings_ts_packages }}
        run: |
          filters=()
          for pkg in $TS_PACKAGES; do
            filters+=(--filter "$pkg")
          done
          pnpm "${filters[@]}" test
      - name: Build Node and Web bindings
        env:
          TS_PACKAGES: ${{ needs.plan.outputs.bindings_ts_packages }}
        run: |
          filters=()
          for pkg in $TS_PACKAGES; do
            filters+=(--filter "${pkg}...")
          done
          pnpm "${filters[@]}" build
      - name: Prepare browser e2e fixtures
        env:
          BINDINGS_WEB: ${{ needs.plan.outputs.bindings_web }}
        run: |
          if [ "$BINDINGS_WEB" != true ]; then
            pnpm --filter @minip2p/web wasm:build
            pnpm --filter @minip2p/web... build
          fi
          cargo build --locked -p minip2p-relay-server-example
      - name: Generated web glue is current
        run: test -z "$(git status --porcelain)"
      - name: Restore Playwright browsers
        id: playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bindings/ts/web/package.json') }}
      - name: Install Playwright browsers
        env:
          CACHE_HIT: ${{ steps.playwright.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            pnpm --filter @minip2p/web exec playwright install-deps chromium firefox
          else
            pnpm --filter @minip2p/web exec playwright install --with-deps chromium firefox
          fi
      - name: Save Playwright browsers
        if: github.ref == 'refs/heads/main' && steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.cache-primary-key }}
      - name: Browser e2e
        run: pnpm --filter @minip2p/web test:e2e

  rn-bindings:
    needs: plan
    if: needs.plan.outputs.bindings_rn_gen == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: rn-bindings
      - run: pnpm --filter @minip2p/core --filter @minip2p/react-native typecheck
      - run: pnpm --filter @minip2p/core --filter @minip2p/react-native test
      - run: pnpm --filter @minip2p/core --filter @minip2p/react-native build
      - run: pnpm --filter @minip2p/react-native test:built
      - uses: ./.github/actions/run-ubrn
        with:
          rust-cachekey: ${{ steps.rust.outputs.cachekey }}
          command: pnpm rn:generate
      - name: Generated React Native files are current
        run: test -z "$(git status --porcelain)"

  ci:
    if: always()
    needs:
      - plan
      - checks
      - lint
      - test-workspace
      - test-matrix
      - msrv
      - bench-build
      - fuzz-smoke
      - relay-container
      - docs-site
      - ts-bindings
      - rn-bindings
    runs-on: ubuntu-latest
    steps:
      - name: Verify all reachable checks passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          SUMMARY: ${{ needs.plan.outputs.summary }}
        run: |
          echo "Plan summary: $SUMMARY"
          jq -e 'all(.[]; . == "success" or . == "skipped")' <<<"$RESULTS" >/dev/null

  prune-caches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prune-caches.sh
