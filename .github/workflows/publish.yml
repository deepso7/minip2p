name: Publish crates

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-io-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Verify release tag and workspace version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "minip2p") | .version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match workspace version $version (expected v$version)"
            exit 1
          fi

          mismatched_dependencies="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r --arg requirement "^$version" '
                .packages[]
                | select(.publish != [])
                | .name as $package
                | .dependencies[]
                | select(
                    .source == null
                    and .kind != "dev"
                    and (.name | startswith("minip2p"))
                    and .req != $requirement
                  )
                | "\($package) -> \(.name) uses \(.req), expected \($requirement)"
              '
          )"
          if [[ -n "$mismatched_dependencies" ]]; then
            echo "::error::Publishable local dependencies do not match workspace version:"
            echo "$mismatched_dependencies"
            exit 1
          fi

          echo "CRATE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test release commit
        run: |
          cargo test --workspace --locked
          cargo test -p minip2p --features nat,pubsub,discovery --locked
          cargo doc --workspace --no-deps --locked

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail

          crates=(
            minip2p-identity
            minip2p-core
            minip2p-transport
            minip2p-tls
            minip2p-noise
            minip2p-yamux
            minip2p-multistream-select
            minip2p-identify
            minip2p-ping
            minip2p-relay
            minip2p-autonat
            minip2p-dcutr
            minip2p-discovery
            minip2p-swarm
            minip2p-circuit
            minip2p-nat
            minip2p-pubsub
            minip2p-quic
            minip2p
          )

          for crate in "${crates[@]}"; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$CRATE_VERSION")"

            if [[ "$status" == "200" ]]; then
              echo "$crate $CRATE_VERSION is already published; skipping"
              continue
            fi
            if [[ "$status" != "404" ]]; then
              echo "::error::crates.io returned HTTP $status while checking $crate $CRATE_VERSION"
              exit 1
            fi

            cargo publish --package "$crate"
          done
