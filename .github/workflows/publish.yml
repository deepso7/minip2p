name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

# Every rust-cache below runs with `save-if: false`. These jobs check out a tag,
# so a save would key on that tag and never be read again — one release's worth
# of caches was ~3.5 GB against a 10 GB repo ceiling, evicting the main-branch
# caches that CI actually reuses. Restores still fall back to main.

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24.13.0"
  PNPM_VERSION: "11.18.0"

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"

      - name: Verify release tag and package versions
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          version="$(jq -r '.packages[] | select(.name == "minip2p-rs") | .version' <<<"$metadata")"
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match workspace version $version (expected v$version)"
            exit 1
          fi

          mismatched_versions="$(
            jq -r --arg version "$version" '
              .packages[]
              | select(
                  (.name == "minip2p-rs" or (.name | startswith("minip2p-")))
                  and .publish != []
                  and .version != $version
                )
              | "\(.name) is \(.version), expected \($version)"
            ' <<<"$metadata"
          )"
          if [[ -n "$mismatched_versions" ]]; then
            echo "::error::All published minip2p crates must use the same version:"
            echo "$mismatched_versions"
            exit 1
          fi

          mismatched_dependencies="$(
            jq -r --arg requirement "^$version" '
              .packages[]
              | select(.publish != [])
              | .name as $package
              | .dependencies[]
              | select(
                  .source == null
                  and .kind != "dev"
                  and (.name | startswith("minip2p"))
                  and .req != $requirement
                )
              | "\($package) -> \(.name) uses \(.req), expected \($requirement)"
            ' <<<"$metadata"
          )"
          if [[ -n "$mismatched_dependencies" ]]; then
            echo "::error::Publishable local dependencies do not match workspace version:"
            echo "$mismatched_dependencies"
            exit 1
          fi

          core_version="$(jq -r '.version' bindings/ts/core/package.json)"
          react_native_version="$(jq -r '.version' bindings/ts/react-native/package.json)"
          node_version="$(jq -r '.version' bindings/ts/node/package.json)"
          if [[ "$core_version" != "$version" || "$react_native_version" != "$version" || "$node_version" != "$version" ]]; then
            echo "::error::Rust and public TypeScript packages must use $version; core=$core_version react-native=$react_native_version node=$node_version"
            exit 1
          fi
          if [[ "$(jq -r '.private // false' bindings/ts/node/package.json)" == "true" ]]; then
            echo "::error::@minip2p/node must be public"
            exit 1
          fi
          platform_errors="$({
            for manifest in bindings/ts/node/npm/*/package.json; do
              jq -r --arg version "$version" '
                select(.version != $version or .publishConfig.access != "public")
                | "\(.name) is not public at \($version)"
              ' "$manifest"
            done
            jq -r --arg version "$version" '
              .optionalDependencies // {}
              | to_entries[]
              | select(.key | startswith("@minip2p/node-"))
              | select(.value != $version)
              | "\(.key) uses \(.value), expected \($version)"
            ' bindings/ts/node/package.json
          } )"
          if [[ -n "$platform_errors" ]] ||
            [[ "$(jq '[.optionalDependencies | to_entries[] | select(.key | startswith("@minip2p/node-"))] | length' bindings/ts/node/package.json)" != 7 ]]; then
            echo "::error::Node platform packages must be public and lockstep-versioned"
            echo "$platform_errors"
            exit 1
          fi
          if [[ "$(jq -r '.dependencies["@minip2p/core"]' bindings/ts/react-native/package.json)" != "workspace:*" ]]; then
            echo "::error::@minip2p/react-native must depend on @minip2p/core through workspace:*"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-rust:
    name: Test Rust release
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Test release commit
        run: |
          cargo test --workspace --locked
          cargo test -p minip2p-rs --features nat,pubsub,discovery,mdns,tcp --locked
          cargo test -p minip2p-tcp --features smoltcp --locked
          cargo test -p minip2p-mdns --features smoltcp --locked
          cargo test -p minip2p-rs --no-default-features --features smoltcp --locked
          cargo doc --workspace --no-deps --locked
          cargo doc -p minip2p-tcp --features smoltcp --no-deps --locked
          cargo doc -p minip2p-mdns --features smoltcp --no-deps --locked
          cargo doc -p minip2p-rs --no-default-features --features smoltcp --no-deps --locked

  node-native:
    name: Build Node addon (${{ matrix.target }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: x86_64-apple-darwin
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: pnpm install --frozen-lockfile
      - name: Build addon
        shell: bash
        run: pnpm --filter @minip2p/node native:build:target --target ${{ matrix.target }} -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: node-binding-${{ matrix.target }}
          path: bindings/ts/node/minip2p.*.node
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  node-musl:
    name: Build Node addon (${{ matrix.target }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: pnpm install --frozen-lockfile --force
      - name: Build addon
        run: pnpm --filter @minip2p/node native:build:target --target ${{ matrix.target }} -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: node-binding-${{ matrix.target }}
          path: bindings/ts/node/minip2p.*.node
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  relay-server-binaries:
    name: Build relay server (${{ matrix.target }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      - name: Build and smoke-test release binary
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p minip2p-relay-server-example

          binary="target/release/minip2p-relay"
          "$binary" --help >/dev/null
          test "$("$binary" --version)" = "minip2p-relay $RELEASE_VERSION"

          release_dir="$RUNNER_TEMP/relay-release"
          scripts/package-relay-server.sh \
            "$RELEASE_VERSION" \
            "$RELEASE_TARGET" \
            "$binary" \
            "$release_dir"

          archive="minip2p-relay-server-v$RELEASE_VERSION-$RELEASE_TARGET"
          mkdir "$RUNNER_TEMP/relay-smoke"
          tar -xzf "$release_dir/$archive.tar.gz" -C "$RUNNER_TEMP/relay-smoke"
          packaged="$RUNNER_TEMP/relay-smoke/$archive/minip2p-relay"
          "$packaged" --help >/dev/null
          test "$("$packaged" --version)" = "minip2p-relay $RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-server-${{ matrix.target }}
          path: ${{ runner.temp }}/relay-release/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-relay-server-binaries:
    name: Publish relay server binaries
    if: github.event_name == 'release'
    needs: [verify-release, relay-server-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: relay-server-*
          path: ${{ runner.temp }}/relay-release
          merge-multiple: true
      - name: Attach binaries and checksums to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.sha }}
        working-directory: ${{ runner.temp }}/relay-release
        run: |
          set -euo pipefail
          archives=(minip2p-relay-server-*.tar.gz)
          test "${#archives[@]}" -eq 2
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload \
            "$RELEASE_TAG" \
            "${archives[@]}" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-relay-container:
    name: Publish relay container
    if: github.event_name == 'release'
    needs: [verify-release, publish-relay-server-binaries]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/relay-container.yml
    with:
      version: ${{ needs.verify-release.outputs.version }}

  android-native:
    name: Build Android release artifacts
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 and NDK r28c
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm rn:android
      - name: Validate Android ELF alignment and allocator hooks
        run: node react-native/scripts/check-android-elf.mjs
      - run: pnpm example prebuild
      - name: Build both Android ABIs
        working-directory: bindings/ts/react-native/example/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Validate 16 KiB APK zip alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 \
            react-native/example/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enforce native size budget
        run: node react-native/scripts/check-native-size.mjs android
        env:
          NATIVE_SIZE_STRICT: "1"
      - name: Archive Android libraries
        run: |
          tar \
            -C react-native/android/src/main \
            -czf "$RUNNER_TEMP/minip2p-android-native.tar.gz" \
            jniLibs
      - uses: actions/upload-artifact@v7
        with:
          name: minip2p-android-native
          path: ${{ runner.temp }}/minip2p-android-native.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  ios-native:
    name: Build iOS release artifacts
    needs: verify-release
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm rn:ios
      - name: Validate XCFramework slices
        run: |
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64/libminip2p_ffi.a
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64-simulator/libminip2p_ffi.a
      - name: Enforce native size budget
        run: node react-native/scripts/check-native-size.mjs ios
        env:
          NATIVE_SIZE_STRICT: "1"
      - name: Archive iOS XCFramework
        run: |
          tar \
            -C react-native/build \
            -czf "$RUNNER_TEMP/minip2p-ios-native.tar.gz" \
            Minip2pFfi.xcframework
      - uses: actions/upload-artifact@v7
        with:
          name: minip2p-ios-native
          path: ${{ runner.temp }}/minip2p-ios-native.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  package-typescript:
    name: Assemble TypeScript packages
    needs: [verify-release, android-native, ios-native, node-native, node-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK r28c for package validation
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @minip2p/react-native test:built
      - run: pnpm rn:generate
      - name: Generated files are current
        run: test -z "$(git status --porcelain)"
      - uses: actions/download-artifact@v8
        with:
          name: minip2p-android-native
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@v8
        with:
          name: minip2p-ios-native
          path: ${{ runner.temp }}/native
      - name: Restore native artifacts
        run: |
          mkdir -p react-native/build
          tar -xzf "$RUNNER_TEMP/native/minip2p-android-native.tar.gz" \
            -C react-native/android/src/main
          tar -xzf "$RUNNER_TEMP/native/minip2p-ios-native.tar.gz" \
            -C react-native/build
      - uses: actions/download-artifact@v8
        with:
          pattern: node-binding-*
          path: bindings/ts/node/artifacts
          merge-multiple: true
      - name: Assemble Node platform packages
        run: |
          pnpm --filter @minip2p/node exec napi create-npm-dirs
          pnpm --filter @minip2p/node exec napi artifacts --output-dir artifacts
      - name: Pack public packages
        run: |
          mkdir -p release-packages
          pnpm --filter @minip2p/core pack \
            --pack-destination "$PWD/release-packages"
          pnpm --filter @minip2p/react-native pack \
            --pack-destination "$PWD/release-packages"
          pnpm --filter @minip2p/node pack \
            --pack-destination "$PWD/release-packages"
          pnpm --dir node/npm/linux-x64-gnu pack \
            --pack-destination "$PWD/release-packages"
      - name: Verify packed contents and dependency versions
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          node scripts/verify-release-packages.mjs \
            "$RELEASE_VERSION" \
            "release-packages/minip2p-core-$RELEASE_VERSION.tgz" \
            "release-packages/minip2p-react-native-$RELEASE_VERSION.tgz" \
            react-native \
            "release-packages/minip2p-node-$RELEASE_VERSION.tgz" \
            node/npm
      - name: Smoke-test installation from tarballs
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          consumer="$(mktemp -d)"
          npm install \
            --prefix "$consumer" \
            --ignore-scripts \
            --legacy-peer-deps \
            "$PWD/release-packages/minip2p-core-$RELEASE_VERSION.tgz" \
            "$PWD/release-packages/minip2p-react-native-$RELEASE_VERSION.tgz" \
            "$PWD/release-packages/minip2p-node-$RELEASE_VERSION.tgz" \
            "$PWD/release-packages/minip2p-node-linux-x64-gnu-$RELEASE_VERSION.tgz"
          node scripts/smoke-release-install.mjs "$consumer"
      - uses: actions/upload-artifact@v7
        with:
          name: minip2p-npm-packages
          path: bindings/ts/release-packages/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-crates:
    name: Publish to crates.io
    if: github.event_name == 'release'
    needs: [verify-release, test-rust, package-typescript]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          CRATE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail

          crate_http_code() {
            curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --user-agent 'minip2p-release-workflow (https://github.com/deepso7/minip2p)' \
              "https://crates.io/api/v1/crates/$1/$CRATE_VERSION"
          }

          crates=(
            minip2p-platform
            minip2p-identity
            minip2p-core
            minip2p-transport
            minip2p-tls
            minip2p-noise
            minip2p-yamux
            minip2p-multistream-select
            minip2p-secure-mux
            minip2p-identify
            minip2p-ping
            minip2p-relay
            minip2p-autonat
            minip2p-dcutr
            minip2p-discovery
            minip2p-smoltcp
            minip2p-mdns
            minip2p-swarm
            minip2p-circuit
            minip2p-nat
            minip2p-relay-server
            minip2p-pubsub
            minip2p-quic
            minip2p-tcp
            minip2p-rs
          )

          for crate in "${crates[@]}"; do
            status="$(crate_http_code "$crate")"

            if [[ "$status" == "200" ]]; then
              echo "$crate $CRATE_VERSION is already published; skipping"
              continue
            fi
            if [[ "$status" != "404" ]]; then
              echo "::error::crates.io returned HTTP $status while checking $crate $CRATE_VERSION"
              exit 1
            fi

            for attempt in {1..6}; do
              if cargo publish --package "$crate"; then
                break
              fi

              delay=$((attempt * 10))
              echo "Publish attempt $attempt for $crate failed; checking the registry in ${delay}s"
              sleep "$delay"

              status="$(crate_http_code "$crate")"
              if [[ "$status" == "200" ]]; then
                echo "$crate $CRATE_VERSION reached crates.io despite the publish error; continuing"
                break
              fi
              if [[ "$status" != "404" ]]; then
                echo "::error::crates.io returned HTTP $status while checking $crate $CRATE_VERSION"
                exit 1
              fi
              if [[ "$attempt" == 6 ]]; then
                echo "::error::Failed to publish $crate after $attempt attempts"
                exit 1
              fi

              echo "$crate $CRATE_VERSION is not visible yet; retrying publication"
            done
          done

  publish-node-platforms:
    name: Publish Node platform packages
    if: github.event_name == 'release'
    needs: [verify-release, publish-crates, node-native, node-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: node-binding-*
          path: bindings/ts/node/artifacts
          merge-multiple: true
      - name: Assemble and validate all platform packages
        run: |
          pnpm --filter @minip2p/node exec napi create-npm-dirs
          pnpm --filter @minip2p/node exec napi artifacts --output-dir artifacts
          test "$(find node/npm -name 'minip2p.*.node' -type f | wc -l)" -eq 7
      - name: Publish platform packages with npm trusted publishing
        run: pnpm --filter @minip2p/node exec napi prepublish -t npm --no-gh-release

  publish-typescript:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: [verify-release, publish-crates, publish-node-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: minip2p-npm-packages
          path: packages
      - name: Check npm trusted publishing support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) process.exit(1);
          ' "$npm_version"
          echo "npm $npm_version supports trusted publishing"
      - name: Publish public TypeScript packages
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail

          publish_package() {
            package_name="$1"
            tarball="$2"
            encoded_name="${package_name/@/%40}"
            encoded_name="${encoded_name/\//%2f}"
            package_http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --user-agent 'minip2p-release-workflow (https://github.com/deepso7/minip2p)' \
              "https://registry.npmjs.org/$encoded_name/$RELEASE_VERSION")"

            if [[ "$package_http_code" == "200" ]]; then
              echo "$package_name $RELEASE_VERSION is already published; skipping"
              return
            fi
            if [[ "$package_http_code" != "404" ]]; then
              echo "::error::npm returned HTTP $package_http_code while checking $package_name@$RELEASE_VERSION"
              exit 1
            fi

            npm publish "./$tarball" --access public
          }

          publish_package \
            "@minip2p/core" \
            "packages/minip2p-core-$RELEASE_VERSION.tgz"
          publish_package \
            "@minip2p/react-native" \
            "packages/minip2p-react-native-$RELEASE_VERSION.tgz"
          publish_package \
            "@minip2p/node" \
            "packages/minip2p-node-$RELEASE_VERSION.tgz"
