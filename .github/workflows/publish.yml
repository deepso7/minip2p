name: Publish crates

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-io-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Verify release tag and workspace version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          version="$(jq -r '.packages[] | select(.name == "minip2p-rs") | .version' <<<"$metadata")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match workspace version $version (expected v$version)"
            exit 1
          fi

          mismatched_versions="$(
            jq -r --arg version "$version" '
              .packages[]
              | select(
                  (.name == "minip2p-rs" or (.name | startswith("minip2p-")))
                  and .publish != []
                  and .version != $version
                )
              | "\(.name) is \(.version), expected \($version)"
            ' <<<"$metadata"
          )"
          if [[ -n "$mismatched_versions" ]]; then
            echo "::error::All published minip2p crates must use the same version:"
            echo "$mismatched_versions"
            exit 1
          fi

          mismatched_dependencies="$(
            jq -r --arg requirement "^$version" '
              .packages[]
              | select(.publish != [])
              | .name as $package
              | .dependencies[]
              | select(
                  .source == null
                  and .kind != "dev"
                  and (.name | startswith("minip2p"))
                  and .req != $requirement
                )
              | "\($package) -> \(.name) uses \(.req), expected \($requirement)"
            ' <<<"$metadata"
          )"
          if [[ -n "$mismatched_dependencies" ]]; then
            echo "::error::Publishable local dependencies do not match workspace version:"
            echo "$mismatched_dependencies"
            exit 1
          fi

          echo "CRATE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test release commit
        run: |
          cargo test --workspace --locked
          cargo test -p minip2p-rs --features nat,pubsub,discovery,mdns --locked
          cargo doc --workspace --no-deps --locked

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail

          crates=(
            minip2p-identity
            minip2p-core
            minip2p-transport
            minip2p-tls
            minip2p-noise
            minip2p-yamux
            minip2p-multistream-select
            minip2p-identify
            minip2p-ping
            minip2p-relay
            minip2p-autonat
            minip2p-dcutr
            minip2p-discovery
            minip2p-mdns
            minip2p-swarm
            minip2p-circuit
            minip2p-nat
            minip2p-pubsub
            minip2p-quic
            minip2p-rs
          )

          for crate in "${crates[@]}"; do
            crate_http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user-agent 'minip2p-release-workflow (https://github.com/deepso7/minip2p)' \
              "https://crates.io/api/v1/crates/$crate/$CRATE_VERSION")"

            if [[ "$crate_http_code" == "200" ]]; then
              echo "$crate $CRATE_VERSION is already published; skipping"
              continue
            fi
            if [[ "$crate_http_code" != "404" ]]; then
              echo "::error::crates.io returned HTTP $crate_http_code while checking $crate $CRATE_VERSION"
              exit 1
            fi

            for attempt in {1..6}; do
              if cargo publish --package "$crate"; then
                break
              fi

              if [[ "$attempt" == 6 ]]; then
                echo "::error::Failed to publish $crate after $attempt attempts"
                exit 1
              fi

              delay=$((attempt * 10))
              echo "Publish attempt $attempt for $crate failed; retrying in ${delay}s while crates.io indexes dependencies"
              sleep "$delay"
            done
          done
