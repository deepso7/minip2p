name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to resume; leave blank for validation only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          cache: "false"
      - name: Verify release tag and package versions
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(scripts/verify-release-versions.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-rust-workspace:
    name: Test Rust workspace
    needs: verify-release
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          shared-key: msrv
          save-cache: never
          nextest: "true"
      - name: Test workspace, doctests, and docs
        run: |
          cargo nextest run --workspace --locked
          cargo test --workspace --doc --locked
          cargo test -p minip2p-tcp --features smoltcp --doc --locked
          scripts/check-targets.sh docs

  test-rust-matrix:
    name: Test Rust feature matrix (${{ matrix.shard }}/4)
    needs: verify-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          shared-key: msrv
          save-cache: never
          nextest: "true"
      - name: Test release feature-matrix shard
        run: scripts/run-feature-matrix.sh test full --shard "${{ matrix.shard }}/4"

  node-native:
    name: Build Node addon (${{ matrix.target }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: x86_64-apple-darwin
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}
          shared-key: node-native
          save-cache: never
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
          normalize-windows-patches: "true"
          save-cache: never
      - name: Build addon
        shell: bash
        run: pnpm --filter @minip2p/node native:build:target --target ${{ matrix.target }} -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-binding-${{ matrix.target }}
          path: bindings/ts/node/minip2p.*.node
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  node-musl:
    name: Build Node addon (${{ matrix.target }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - name: Build musl addon
        run: scripts/build-node-musl.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-binding-${{ matrix.target }}
          path: bindings/ts/node/minip2p.*.node
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  relay-server-binaries:
    name: Build relay server (${{ matrix.target }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}
          save-cache: never
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and smoke-test release binary
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="$(scripts/build-relay-release.sh "$RELEASE_TARGET")"
          "$binary" --help >/dev/null
          test "$("$binary" --version)" = "minip2p-relay $RELEASE_VERSION"

          release_dir="$RUNNER_TEMP/relay-release"
          scripts/package-relay-server.sh \
            "$RELEASE_VERSION" \
            "$RELEASE_TARGET" \
            "$binary" \
            "$release_dir"

          archive="minip2p-relay-server-v$RELEASE_VERSION-$RELEASE_TARGET"
          mkdir "$RUNNER_TEMP/relay-smoke"
          tar -xzf "$release_dir/$archive.tar.gz" -C "$RUNNER_TEMP/relay-smoke"
          packaged="$RUNNER_TEMP/relay-smoke/$archive/minip2p-relay"
          "$packaged" --help >/dev/null
          test "$("$packaged" --version)" = "minip2p-relay $RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-server-${{ matrix.target }}
          path: ${{ runner.temp }}/relay-release/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-relay-server-binaries:
    name: Publish relay server binaries
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs:
      [
        verify-release,
        test-rust-workspace,
        test-rust-matrix,
        relay-server-binaries,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relay-server-*
          path: ${{ runner.temp }}/relay-release
          merge-multiple: true
      - name: Attach binaries and checksums to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
        working-directory: ${{ runner.temp }}/relay-release
        run: |
          set -euo pipefail
          archives=(minip2p-relay-server-*.tar.gz)
          test "${#archives[@]}" -eq 2
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload \
            "$RELEASE_TAG" \
            "${archives[@]}" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-relay-container:
    name: Publish relay container
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: [verify-release, publish-relay-server-binaries]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/relay-container.yml
    with:
      version: ${{ needs.verify-release.outputs.version }}

  android-native:
    name: Build Android release artifacts
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-android
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
          shared-key: android
          save-cache: never
          cargo-ndk: "true"
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
          save-cache: never
      - uses: ./.github/actions/run-ubrn
        with:
          rust-cachekey: ${{ steps.rust.outputs.cachekey }}
          working-directory: bindings/ts
          command: pnpm --workspace-root rn:android
          save-cache: never
      - name: Validate Android ELF alignment and allocator hooks
        run: node react-native/scripts/check-android-elf.mjs
      - name: Enforce native size budget
        run: node react-native/scripts/check-native-size.mjs android
        env:
          NATIVE_SIZE_STRICT: "1"
      - name: Archive Android libraries
        run: |
          tar \
            -C react-native/android/src/main \
            -czf "$RUNNER_TEMP/minip2p-android-native.tar.gz" \
            jniLibs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minip2p-android-native
          path: ${{ runner.temp }}/minip2p-android-native.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  android-apk:
    name: Build Android example APK
    needs: android-native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-android
        with:
          java: "true"
          sdk-platform: "true"
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
          save-cache: never
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minip2p-android-native
          path: ${{ runner.temp }}/native
      - name: Restore Android libraries
        run: |
          tar -xzf "$RUNNER_TEMP/native/minip2p-android-native.tar.gz" \
            -C react-native/android/src/main
      - run: pnpm --workspace-root example prebuild
      - name: Restore Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'examples/react-native/package.json', 'bindings/ts/react-native/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build both Android ABIs
        working-directory: examples/react-native/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Validate 16 KiB APK zip alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 \
            ../../examples/react-native/android/app/build/outputs/apk/debug/app-debug.apk

  ios-native:
    name: Build iOS release artifacts
    needs: verify-release
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          shared-key: ios
          save-cache: never
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
          save-cache: never
      - uses: ./.github/actions/run-ubrn
        with:
          rust-cachekey: ${{ steps.rust.outputs.cachekey }}
          working-directory: bindings/ts
          command: pnpm --workspace-root rn:ios
          save-cache: never
      - name: Validate XCFramework slices
        run: |
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64/libminip2p_ffi.a
          lipo -info react-native/build/Minip2pFfi.xcframework/ios-arm64-simulator/libminip2p_ffi.a
      - name: Enforce native size budget
        run: node react-native/scripts/check-native-size.mjs ios
        env:
          NATIVE_SIZE_STRICT: "1"
      - name: Archive iOS XCFramework
        run: |
          tar \
            -C react-native/build \
            -czf "$RUNNER_TEMP/minip2p-ios-native.tar.gz" \
            Minip2pFfi.xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minip2p-ios-native
          path: ${{ runner.temp }}/minip2p-ios-native.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  package-typescript:
    name: Assemble TypeScript packages
    needs: [verify-release, android-native, ios-native, node-native, node-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
          save-cache: never
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: generated-and-typescript
          save-cache: never
          wasm-bindgen: "true"
      - name: Build the web wasm
        run: pnpm --filter @minip2p/web wasm:build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-binding-*
          path: bindings/ts/node/artifacts
          merge-multiple: true
      - name: Assemble Node platform packages
        run: pnpm --filter @minip2p/node native:artifacts
      - run: pnpm --workspace-root typecheck
      - run: pnpm --workspace-root test
      - run: pnpm --workspace-root lint
      - run: pnpm --workspace-root build:bindings
      - run: pnpm --filter @minip2p/react-native test:built
      - uses: ./.github/actions/run-ubrn
        with:
          rust-cachekey: ${{ steps.rust.outputs.cachekey }}
          working-directory: bindings/ts
          command: pnpm --workspace-root rn:generate
          save-cache: never
      - name: Generated files are current
        run: test -z "$(git status --porcelain -- react-native web)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minip2p-android-native
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minip2p-ios-native
          path: ${{ runner.temp }}/native
      - name: Restore native artifacts
        run: |
          mkdir -p react-native/build
          tar -xzf "$RUNNER_TEMP/native/minip2p-android-native.tar.gz" \
            -C react-native/android/src/main
          tar -xzf "$RUNNER_TEMP/native/minip2p-ios-native.tar.gz" \
            -C react-native/build
      - name: Pack public packages
        run: |
          mkdir -p release-packages
          pnpm --filter @minip2p/core pack \
            --pack-destination "$PWD/release-packages"
          pnpm --filter @minip2p/react-native pack \
            --pack-destination "$PWD/release-packages"
          pnpm --filter @minip2p/node pack \
            --pack-destination "$PWD/release-packages"
          pnpm --filter @minip2p/web pack \
            --pack-destination "$PWD/release-packages"
          for platform_dir in node-platforms/*; do
            pnpm --dir "$platform_dir" pack \
              --pack-destination "$PWD/release-packages"
          done
      - name: Verify packed contents and dependency versions
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          node scripts/verify-release-packages.mjs \
            "$RELEASE_VERSION" \
            "release-packages/minip2p-core-$RELEASE_VERSION.tgz" \
            "release-packages/minip2p-react-native-$RELEASE_VERSION.tgz" \
            react-native \
            "release-packages/minip2p-node-$RELEASE_VERSION.tgz" \
            node-platforms \
            "release-packages/minip2p-web-$RELEASE_VERSION.tgz"
      - name: Smoke-test installation from tarballs
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          consumer="$(mktemp -d)"
          npm install \
            --prefix "$consumer" \
            --ignore-scripts \
            --legacy-peer-deps \
            "$PWD/release-packages/minip2p-core-$RELEASE_VERSION.tgz" \
            "$PWD/release-packages/minip2p-react-native-$RELEASE_VERSION.tgz" \
            "$PWD/release-packages/minip2p-node-$RELEASE_VERSION.tgz" \
            "$PWD/release-packages/minip2p-node-linux-x64-gnu-$RELEASE_VERSION.tgz" \
            "$PWD/release-packages/minip2p-web-$RELEASE_VERSION.tgz"
          node scripts/smoke-release-install.mjs "$consumer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minip2p-node-platform-packages
          path: bindings/ts/node-platforms
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minip2p-npm-packages
          path: bindings/ts/release-packages/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-crates:
    name: Publish to crates.io
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs:
      [
        verify-release,
        test-rust-workspace,
        test-rust-matrix,
        package-typescript,
        android-apk,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          save-cache: never
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: scripts/publish-crates.sh "${{ needs.verify-release.outputs.version }}"

  publish-node-platforms:
    name: Publish Node platform packages
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs:
      [
        verify-release,
        test-rust-workspace,
        test-rust-matrix,
        package-typescript,
        android-apk,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bindings/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-node
        with:
          working-directory: bindings/ts
          registry-url: https://registry.npmjs.org
          save-cache: never
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minip2p-node-platform-packages
          path: bindings/ts/node-platforms
      - name: Check verified platform artifacts
        run: test "$(find node-platforms -name 'minip2p.*.node' -type f -size +0c | wc -l)" -eq 7
      - name: Publish platform packages with npm trusted publishing
        run: pnpm --filter @minip2p/node native:prepublish

  publish-typescript:
    name: Publish to npm
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: [verify-release, publish-crates, publish-node-platforms, android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: ./.github/actions/setup-node
        with:
          install: "false"
          registry-url: https://registry.npmjs.org
          save-cache: never
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minip2p-npm-packages
          path: packages
      - name: Publish public TypeScript packages
        run: scripts/publish-npm-packages.sh "${{ needs.verify-release.outputs.version }}" packages
