name: Publish relay container

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without the v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-container
  cancel-in-progress: false

jobs:
  publish:
    name: Publish relay container
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release assets and select tags
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            ""|*[!0-9A-Za-z.+-]*)
              echo "::error::Invalid release version: $RELEASE_VERSION"
              exit 1
              ;;
          esac

          assets="$(gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets)"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            asset="minip2p-relay-server-v$RELEASE_VERSION-$target.tar.gz"
            jq -e --arg asset "$asset" \
              'any(.assets[]; .name == $asset and .size > 0)' \
              <<<"$assets" >/dev/null
          done
          jq -e 'any(.assets[]; .name == "SHA256SUMS" and .size > 0)' \
            <<<"$assets" >/dev/null

          latest_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/deepso7/minip2p-relay:v$RELEASE_VERSION"
            if [[ "$latest_tag" == "v$RELEASE_VERSION" ]]; then
              echo "ghcr.io/deepso7/minip2p-relay:latest"
            fi
            echo EOF
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Run each architecture's image from the downloaded release binaries
      # before pushing; arm64 runs under QEMU. The publish build below reuses
      # these layers from the builder cache.
      - name: Build amd64 image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/relay/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: MINIP2P_VERSION=${{ inputs.version }}
          tags: minip2p-relay:verify-amd64
      - name: Build arm64 image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/relay/Dockerfile
          platforms: linux/arm64
          load: true
          build-args: MINIP2P_VERSION=${{ inputs.version }}
          tags: minip2p-relay:verify-arm64
      - name: Verify images start
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          scripts/check-relay-image.sh minip2p-relay:verify-amd64 "$RELEASE_VERSION" linux/amd64
          scripts/check-relay-image.sh minip2p-relay:verify-arm64 "$RELEASE_VERSION" linux/arm64

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: MINIP2P_VERSION=${{ inputs.version }}
          tags: ${{ steps.release.outputs.tags }}
          provenance: mode=max
          sbom: true
          # No type=gha cache: this runs on a release tag ref, and Actions
          # caches saved there are only readable by that same tag, so the next
          # release could never restore it (see publish.yml's rust-cache note).

      - name: Verify anonymous access
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          if ! docker buildx imagetools inspect \
            "ghcr.io/deepso7/minip2p-relay:v$RELEASE_VERSION"; then
            echo "::error::The relay package is not public. Set its GHCR visibility to Public, then rerun this workflow."
            exit 1
          fi
