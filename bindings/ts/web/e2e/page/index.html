<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>@minip2p/web e2e</title>
    <script type="importmap">
      {
        "imports": {
          "@minip2p/core": "/core/dist/index.js",
          "@minip2p/core/backend": "/core/dist/backend.js",
          "@minip2p/core/serde-backend": "/core/dist/serde-backend.js"
        }
      }
    </script>
    <script>
      // Records how every WebTransport session ended, so a test can check
      // what the browser saw (`closed` fulfilled with code 0 on an orderly
      // native close).
      window.sessionEnds = [];
      const Native = window.WebTransport;
      if (Native !== undefined) {
        window.WebTransport = class extends Native {
          constructor(...args) {
            super(...args);
            this.closed.then(
              (info) =>
                window.sessionEnds.push({
                  closeCode: info.closeCode,
                  fulfilled: true,
                }),
              (error) =>
                window.sessionEnds.push({
                  error: String(error),
                  fulfilled: false,
                })
            );
          }
        };
      }
    </script>
    <script type="module">
      import * as web from "/web/dist/index.js";
      window.web = web;
      window.webReady = true;
    </script>
  </head>
  <body></body>
</html>
