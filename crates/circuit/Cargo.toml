[package]
name = "minip2p-circuit"
description = "Sans-I/O encrypted and multiplexed libp2p circuit transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
    "minip2p-core/std",
    "minip2p-identity/std",
    "minip2p-platform/std",
    "minip2p-secure-mux/std",
    "minip2p-transport/std",
    "thiserror/std",
]

[dependencies]
minip2p-core = { path = "../core", version = "0.4.11", default-features = false }
minip2p-identity = { path = "../identity", version = "0.4.11", default-features = false, features = ["ed25519"] }
minip2p-platform = { path = "../platform", version = "0.4.11", default-features = false }
minip2p-secure-mux = { path = "../secure-mux", version = "0.4.11", default-features = false }
minip2p-transport = { path = "../transport", version = "0.4.11", default-features = false }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
# The handshake fixtures script raw multistream and Noise messages onto the
# bridge, which the transport itself no longer touches directly.
minip2p-multistream-select = { path = "../multistream-select" }
minip2p-noise = { path = "../noise" }
# Proves one `EntropySource` adapter drives both transports; see
# `tests/shared_entropy.rs`.
minip2p-tcp = { path = "../../transports/tcp" }
minip2p-test-support = { path = "../test-support" }
