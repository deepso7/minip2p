[package]
name = "minip2p-core"
description = "Core transport-agnostic types and platform contracts for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["minip2p-identity/std", "thiserror/std", "dep:getrandom"]

[dependencies]
# base64url text for `/certhash` multihashes.
base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
# Shared stream payload handle (ADR 0011); re-exported as `minip2p_core::Bytes`.
bytes = { workspace = true }
getrandom = { workspace = true, optional = true }
minip2p-identity = { path = "../identity", version = "0.10.1", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
gungraun = { workspace = true }

[[bench]]
name = "multiaddr"
harness = false

[[bench]]
name = "multiaddr_ir"
harness = false
