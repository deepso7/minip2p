[package]
name = "minip2p-discovery"
description = "Sans-I/O signed-beacon and multi-source peer discovery for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["minip2p-core/std", "minip2p-identity/std", "thiserror/std"]

[dependencies]
minip2p-core = { path = "../core", version = "0.4.10", default-features = false }
minip2p-identity = { path = "../identity", version = "0.4.10", default-features = false }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "peer_book"
harness = false
