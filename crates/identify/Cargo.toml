[package]
name = "minip2p-identify"
description = "Sans-I/O libp2p identify protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
    "minip2p-core/std",
    "minip2p-transport/std",
    "thiserror/std",
]

[dependencies]
minip2p-core = { path = "../core", version = "0.5.0", default-features = false }
minip2p-transport = { path = "../transport", version = "0.5.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
