[package]
name = "minip2p-mdns"
description = "Sans-I/O libp2p mDNS with a portable driver and an optional socket adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
# Ethernet adds `smoltcp/medium-ethernet` from its own manifest.
smoltcp = ["dep:minip2p-smoltcp"]
std = [
    "minip2p-core/std",
    "minip2p-identity/std",
    "thiserror/std",
    "dep:socket2",
    "dep:if-addrs",
]

[dependencies]
minip2p-core = { path = "../core", version = "0.5.3", default-features = false }
minip2p-identity = { path = "../identity", version = "0.5.3", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
minip2p-smoltcp = { path = "../smoltcp", version = "0.5.3", optional = true }
socket2 = { version = "0.6.5", features = ["all"], optional = true }
if-addrs = { version = "0.14.0", optional = true }
