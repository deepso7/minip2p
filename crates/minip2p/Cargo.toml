[package]
name = "minip2p-rs"
description = "A minimal caller-driven libp2p implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lib]
name = "minip2p"

[lints]
workspace = true

[features]
default = ["std", "quic"]
std = [
  "minip2p-core/std",
  "minip2p-circuit?/std",
  "minip2p-discovery?/std",
  "minip2p-identify/std",
  "minip2p-identity/std",
  "minip2p-mdns?/std",
  "minip2p-nat?/std",
  "minip2p-platform/std",
  "minip2p-pubsub?/std",
  "minip2p-relay-server?/std",
  "minip2p-swarm/std",
  "minip2p-transport/std",
  "minip2p-tcp?/std",
]
quic = ["std", "dep:minip2p-quic"]
tcp = ["dep:minip2p-tcp"]
smoltcp = [
  "tcp",
  "portable-mdns",
  "minip2p-tcp/smoltcp",
  "minip2p-mdns/smoltcp",
]
portable-mdns = ["dep:minip2p-mdns", "_discovery-driver"]
portable-autonat = ["smoltcp", "_nat-driver"]
portable-relay = ["portable-autonat", "_circuit-driver"]
nat = ["std", "_circuit-driver", "_nat-driver"]
relay-server = ["std", "dep:minip2p-relay-server"]
pubsub = ["dep:minip2p-pubsub"]
discovery = ["nat", "pubsub", "_discovery-driver"]
mdns = ["nat", "dep:minip2p-mdns", "_discovery-driver"]
# Internal aliases for capability-driver dependencies, reached only through
# the public features above; not a supported opt-in surface.
_circuit-driver = ["dep:minip2p-circuit"]
_discovery-driver = ["dep:minip2p-discovery"]
_nat-driver = ["dep:minip2p-nat"]

[dependencies]
minip2p-core = { path = "../core", version = "0.7.0", default-features = false }
minip2p-circuit = { path = "../circuit", version = "0.7.0", default-features = false, optional = true }
minip2p-discovery = { path = "../discovery", version = "0.7.0", default-features = false, optional = true }
minip2p-identify = { path = "../identify", version = "0.7.0", default-features = false }
minip2p-identity = { path = "../identity", version = "0.7.0", default-features = false, features = [
  "ed25519",
] }
minip2p-mdns = { path = "../mdns", version = "0.7.0", default-features = false, optional = true }
minip2p-nat = { path = "../nat", version = "0.7.0", default-features = false, optional = true }
minip2p-platform = { path = "../platform", version = "0.7.0", default-features = false }
minip2p-pubsub = { path = "../pubsub", version = "0.7.0", default-features = false, optional = true }
minip2p-relay-server = { path = "../relay-server", version = "0.7.0", default-features = false, optional = true }
minip2p-quic = { path = "../../transports/quic", version = "0.7.0", optional = true }
minip2p-tcp = { path = "../../transports/tcp", version = "0.7.0", default-features = false, optional = true }
minip2p-swarm = { path = "../swarm", version = "0.7.0", default-features = false }
minip2p-transport = { path = "../transport", version = "0.7.0", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

[dev-dependencies]
criterion = "0.8.2"
minip2p-relay = { path = "../relay" }
minip2p-test-support = { path = "../test-support" }

[[bench]]
name = "endpoint_e2e"
harness = false
required-features = ["quic", "tcp"]
