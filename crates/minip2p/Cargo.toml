[package]
name = "minip2p-rs"
description = "A minimal caller-driven libp2p implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lib]
name = "minip2p"

[lints]
workspace = true

[features]
default = ["std", "quic"]
std = [
    "minip2p-core/std",
    "minip2p-circuit?/std",
    "minip2p-discovery?/std",
    "minip2p-identify/std",
    "minip2p-identity/std",
    "minip2p-mdns?/std",
    "minip2p-nat?/std",
    "minip2p-platform/std",
    "minip2p-pubsub?/std",
    "minip2p-relay-server?/std",
    "minip2p-swarm/std",
    "minip2p-transport/std",
    "minip2p-tcp?/std",
]
quic = ["std", "dep:minip2p-quic"]
tcp = ["dep:minip2p-tcp"]
smoltcp = ["tcp", "portable-mdns", "minip2p-tcp/smoltcp", "minip2p-mdns/smoltcp"]
portable-mdns = ["dep:minip2p-mdns", "dep:minip2p-discovery"]
portable-autonat = ["smoltcp", "dep:minip2p-nat"]
portable-relay = ["portable-autonat", "dep:minip2p-circuit"]
nat = ["std", "dep:minip2p-circuit", "dep:minip2p-nat", "dep:getrandom"]
relay-server = ["std", "dep:minip2p-relay-server"]
pubsub = ["dep:minip2p-pubsub", "dep:thiserror"]
discovery = ["nat", "pubsub", "dep:minip2p-discovery"]
mdns = ["nat", "dep:minip2p-mdns", "dep:minip2p-discovery", "dep:thiserror"]

[dependencies]
minip2p-core = { path = "../core", version = "0.4.11", default-features = false }
minip2p-circuit = { path = "../circuit", version = "0.4.11", default-features = false, optional = true }
minip2p-discovery = { path = "../discovery", version = "0.4.11", default-features = false, optional = true }
minip2p-identify = { path = "../identify", version = "0.4.11", default-features = false }
minip2p-identity = { path = "../identity", version = "0.4.11", default-features = false, features = ["ed25519"] }
minip2p-mdns = { path = "../mdns", version = "0.4.11", default-features = false, optional = true }
minip2p-nat = { path = "../nat", version = "0.4.11", default-features = false, optional = true }
minip2p-platform = { path = "../platform", version = "0.4.11", default-features = false }
minip2p-pubsub = { path = "../pubsub", version = "0.4.11", default-features = false, optional = true }
minip2p-relay-server = { path = "../relay-server", version = "0.4.11", default-features = false, optional = true }
minip2p-quic = { path = "../../transports/quic", version = "0.4.11", optional = true }
minip2p-tcp = { path = "../../transports/tcp", version = "0.4.11", default-features = false, optional = true }
minip2p-swarm = { path = "../swarm", version = "0.4.11", default-features = false }
minip2p-transport = { path = "../transport", version = "0.4.11", default-features = false }
getrandom = { version = "0.4.3", optional = true }
thiserror = { version = "2.0.18", default-features = false, optional = true }

[dev-dependencies]
minip2p-relay = { path = "../relay" }
minip2p-test-support = { path = "../test-support" }
