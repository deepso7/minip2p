[package]
name = "minip2p-nat"
description = "Sans-I/O NAT traversal and hole-punch orchestration for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
    "minip2p-autonat/std",
    "minip2p-core/std",
    "minip2p-dcutr/std",
    "minip2p-relay/std",
    "minip2p-swarm/std",
    "minip2p-transport/std",
    "thiserror/std",
]

[dependencies]
minip2p-autonat = { path = "../autonat", version = "0.4.5", default-features = false }
minip2p-core = { path = "../core", version = "0.4.5", default-features = false }
minip2p-dcutr = { path = "../dcutr", version = "0.4.5", default-features = false }
minip2p-relay = { path = "../relay", version = "0.4.5", default-features = false }
minip2p-swarm = { path = "../swarm", version = "0.4.5", default-features = false }
minip2p-transport = { path = "../transport", version = "0.4.5", default-features = false }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
minip2p-test-support = { path = "../test-support" }
