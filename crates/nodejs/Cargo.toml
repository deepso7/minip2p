[package]
name = "minip2p-nodejs"
description = "napi-rs binding shell for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[lints.rust]
# napi-rs's generated module-registration code contains its own scoped
# `allow(unsafe_code)`. `deny` still rejects unsafe in this crate's source while
# allowing that generated scope; the workspace's `forbid` cannot be lowered by
# a procedural macro.
unsafe_code = "deny"

# Cargo does not support inheriting workspace lints while overriding one of
# them, so keep this in sync with `[workspace.lints.clippy]` in the root
# manifest.
[lints.clippy]
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
minip2p-ffi-core = { path = "../ffi-core" }
napi = { version = "=3.12.2", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "=3.6.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[build-dependencies]
napi-build = "=2.4.1"
