[package]
name = "minip2p-relay-server"
description = "Deterministic sans-I/O Circuit Relay v2 server for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
    "minip2p-core/std",
    "minip2p-platform/std",
    "minip2p-relay/std",
    "minip2p-swarm/std",
    "minip2p-transport/std",
    "thiserror/std",
]

[dependencies]
minip2p-core = { path = "../core", version = "0.4.7", default-features = false }
minip2p-platform = { path = "../platform", version = "0.4.7", default-features = false }
minip2p-relay = { path = "../relay", version = "0.4.7", default-features = false }
minip2p-swarm = { path = "../swarm", version = "0.4.7", default-features = false }
minip2p-transport = { path = "../transport", version = "0.4.7", default-features = false }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
minip2p-identity = { path = "../identity", version = "0.4.7" }
minip2p-nat = { path = "../nat", version = "0.4.7" }
