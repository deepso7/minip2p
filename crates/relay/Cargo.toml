[package]
name = "minip2p-relay"
description = "Sans-I/O libp2p Circuit Relay v2 wire protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
    "minip2p-core/std",
    "thiserror/std",
]

[dependencies]
minip2p-core = { path = "../core", version = "0.4.6", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
