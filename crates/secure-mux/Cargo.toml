[package]
name = "minip2p-secure-mux"
description = "Sans-I/O libp2p Noise XX, Yamux, and the multistream-select + Noise + Yamux session over an ordered byte stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
  "minip2p-core/std",
  "minip2p-identity/std",
  "minip2p-multistream-select/std",
  "minip2p-transport/std",
  "thiserror/std",
]

[dependencies]
minip2p-core = { path = "../core", version = "0.11.0", default-features = false }
minip2p-identity = { path = "../identity", version = "0.11.0", default-features = false, features = [
  "ed25519",
] }
minip2p-multistream-select = { path = "../multistream-select", version = "0.11.0", default-features = false }
minip2p-transport = { path = "../transport", version = "0.11.0", default-features = false }
thiserror = { workspace = true }
# Noise XX
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "static_secrets",
] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = [
  "alloc",
] }
sha2 = { workspace = true }
hmac = { version = "0.13.0", default-features = false }

[dev-dependencies]
minip2p-identity = { path = "../identity", features = ["ed25519", "std"] }
criterion = { workspace = true }
gungraun = { workspace = true }

[[bench]]
name = "data_path"
harness = false

[[bench]]
name = "data_path_ir"
harness = false
