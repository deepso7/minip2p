[package]
name = "minip2p-tls"
description = "libp2p TLS certificate generation and peer verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
  "dep:getrandom",
  "minip2p-identity/std",
  "thiserror/std",
  "der/std",
  "der/pem",
  "x509-cert/std",
  "x509-cert/pem",
  "spki/std",
  "p256/std",
  "ecdsa/std",
]

[dependencies]
minip2p-identity = { path = "../identity", version = "0.10.5", default-features = false, features = [
  "ed25519",
] }
der = { version = "0.8.3", default-features = false, features = [
  "alloc",
  "oid",
] }
x509-cert = { version = "0.3.0", default-features = false, features = [
  "builder",
] }
const-oid = { version = "0.10.2", default-features = false }
spki = { version = "0.8.1", default-features = false, features = ["alloc"] }
thiserror = { workspace = true }
p256 = { version = "0.14.0", default-features = false, features = [
  "ecdsa",
  "pkcs8",
  "alloc",
] }
ecdsa = { version = "0.17.0", default-features = false, features = [
  "der",
  "alloc",
] }
signature = { version = "3.0.0", default-features = false }
sha2 = { workspace = true, features = ["oid"] }
rand_core = { workspace = true }
getrandom = { workspace = true, features = ["sys_rng"], optional = true }
hkdf = { version = "0.13.0", default-features = false }
