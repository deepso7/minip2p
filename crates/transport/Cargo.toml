[package]
name = "minip2p-transport"
description = "Sans-I/O transport contract and lifecycle types for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["minip2p-core/std", "minip2p-platform/std", "thiserror/std"]

[dependencies]
minip2p-core = { path = "../core", version = "0.4.11", default-features = false }
minip2p-platform = { path = "../platform", version = "0.4.11", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
