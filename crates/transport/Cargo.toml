[package]
name = "minip2p-transport"
description = "Sans-I/O transport contract and lifecycle types for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["dep:mio", "minip2p-core/std", "minip2p-platform/std", "thiserror/std"]
# Bench-only `SharedPoll` wait counters; see `minip2p_transport::bench`.
bench = ["std"]

[dependencies]
minip2p-core = { path = "../core", version = "0.8.3", default-features = false }
minip2p-platform = { path = "../platform", version = "0.8.3", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
# The shared readiness poll std hosts block on (ADR 0013).
mio = { version = "1.2", features = ["net", "os-poll"], optional = true }

