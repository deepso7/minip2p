[package]
name = "minip2p-transport"
description = "Sans-I/O transport contract and lifecycle types for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["dep:mio", "minip2p-core/std", "thiserror/std"]
# Bench-only `SharedPoll` wait counters; see `minip2p_transport::bench`.
bench = ["std"]

[dependencies]
minip2p-core = { path = "../core", version = "0.9.1", default-features = false }
thiserror = { workspace = true }
# The shared readiness poll std hosts block on (ADR 0013).
mio = { workspace = true, optional = true }

