[package]
name = "minip2p-yamux"
description = "Bounded Sans-I/O libp2p Yamux stream multiplexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["minip2p-core/std", "thiserror/std"]

[dependencies]
minip2p-core = { path = "../core", version = "0.8.3", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
gungraun = { workspace = true }

[[bench]]
name = "data_path"
harness = false

[[bench]]
name = "data_path_ir"
harness = false
