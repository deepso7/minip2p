[package]
name = "minip2p-relay-server-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "minip2p-relay"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
minip2p = { package = "minip2p-rs", path = "../../crates/minip2p", features = [
  "relay-server",
  "tcp",
] }
minip2p-example-common = { path = "../common" }
minip2p-tls = { path = "../../crates/tls" }
rustls-pki-types = "1.15.1"

# Release binaries are static musl, whose allocator roughly halves relayed
# throughput; mimalloc brings it back to the glibc build's.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
