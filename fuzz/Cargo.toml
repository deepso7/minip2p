[package]
name = "minip2p-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Excluded from the workspace, so `[workspace.lints.rust] unsafe_code =
# "forbid"` does not apply here; restate it locally.
[lints.rust]
unsafe_code = "forbid"

# This package is excluded from the workspace, so restate the workspace policy
# here. Fuzz harnesses intentionally discard decoder results and use fixed
# constant slices, so omit the lints that reject those harness idioms.
[lints.clippy]
string_slice = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
let_underscore_future = "warn"
unused_result_ok = "warn"
assertions_on_result_states = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
libfuzzer-sys = "0.4.13"
minip2p-autonat = { path = "../crates/autonat" }
minip2p-circuit = { path = "../crates/circuit" }
minip2p-core = { path = "../crates/core" }
minip2p-dcutr = { path = "../crates/dcutr" }
minip2p-discovery = { path = "../crates/discovery", default-features = false }
minip2p-identity = { path = "../crates/identity", default-features = false }
minip2p-identify = { path = "../crates/identify" }
minip2p-mdns = { path = "../crates/mdns", default-features = false }
minip2p-multistream-select = { path = "../crates/multistream-select" }
minip2p-noise = { path = "../crates/noise" }
minip2p-platform = { path = "../crates/platform", default-features = false }
minip2p-pubsub = { path = "../crates/pubsub", default-features = false }
minip2p-relay = { path = "../crates/relay" }
minip2p-secure-mux = { path = "../crates/secure-mux" }
minip2p-swarm = { path = "../crates/swarm", default-features = false }
minip2p-transport = { path = "../crates/transport" }
minip2p-yamux = { path = "../crates/yamux" }

[[bin]]
name = "wire_inputs"
path = "fuzz_targets/wire_inputs.rs"
test = false
doc = false
bench = false
