[package]
name = "minip2p-quic"
description = "Caller-driven QUIC transport adapter for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
minip2p-platform = { path = "../../crates/platform", version = "0.4.9" }
minip2p-transport = { path = "../../crates/transport", version = "0.4.9" }
minip2p-identity = { path = "../../crates/identity", version = "0.4.9" }
minip2p-core = { path = "../../crates/core", version = "0.4.9" }
minip2p-tls = { path = "../../crates/tls", version = "0.4.9" }
boring = "4.22.0"
quiche = { version = "0.29.2", features = ["boringssl-boring-crate"] }
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
mio = { version = "1.0", features = ["net", "os-poll"] }
socket2 = "0.6.5"

[dev-dependencies]
criterion = "0.8.2"
minip2p-multistream-select = { path = "../../crates/multistream-select" }
minip2p-ping = { path = "../../crates/ping" }
minip2p-swarm = { path = "../../crates/swarm" }
minip2p-identity = { path = "../../crates/identity" }

[[bench]]
name = "idle_poll"
harness = false
