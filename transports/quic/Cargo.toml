[package]
name = "minip2p-quic"
description = "Caller-driven QUIC transport adapter for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints.rust]
# One scoped `expect(unsafe_code)` turns on Apple's fast datapath (see
# `socket.rs`, ADR 0019); the workspace's `forbid` cannot be lowered at a single spot.
# `deny` still rejects every other unsafe in this crate.
unsafe_code = "deny"

# Cargo does not support inheriting workspace lints while overriding one of
# them, so keep this in sync with `[workspace.lints.clippy]` in the root
# manifest.
[lints.clippy]
# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
# Optional - see post for caveats
# expect_used = "warn"
# arithmetic_side_effects = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn" # only relevant on editions before 2024
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# Optional - these effectively force you to document numeric invariants
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[features]
# Diagnostic counters for comparing runs: per-connection flush, datagram,
# loss and congestion counters, and per-identity socket datagram counts. Off
# by default and compiled out when off; see the README.
diagnostics = []

[dependencies]
minip2p-platform = { path = "../../crates/platform", version = "0.8.3" }
minip2p-transport = { path = "../../crates/transport", version = "0.8.3" }
minip2p-identity = { path = "../../crates/identity", version = "0.8.3" }
minip2p-core = { path = "../../crates/core", version = "0.8.3" }
minip2p-tls = { path = "../../crates/tls", version = "0.8.3" }
quinn-proto = { version = "0.11.19", default-features = false, features = [
  "rustls-ring",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
# `fast-apple-datapath`: batched `sendmsg_x`/`recvmsg_x` on Apple targets; a
# no-op elsewhere.
quinn-udp = { version = "0.6.3", default-features = false, features = [
  "fast-apple-datapath",
] }
bytes = "1.12.1"
mio = { version = "1.2", features = ["net", "os-poll"] }
socket2 = "0.6.5"
thiserror = "2.0.20"

[dev-dependencies]
criterion = "0.8.2"
minip2p-multistream-select = { path = "../../crates/multistream-select" }
minip2p-ping = { path = "../../crates/ping" }
minip2p-swarm = { path = "../../crates/swarm" }
minip2p-identity = { path = "../../crates/identity" }

[[bench]]
name = "idle_poll"
harness = false
