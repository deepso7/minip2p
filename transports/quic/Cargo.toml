[package]
name = "minip2p-quic"
description = "Caller-driven QUIC transport adapter for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
# Diagnostic counters for comparing runs: per-connection flush, datagram,
# loss and congestion counters, and per-identity socket datagram counts. Off
# by default and compiled out when off; see the README.
diagnostics = []

[dependencies]
minip2p-platform = { path = "../../crates/platform", version = "0.8.3" }
minip2p-transport = { path = "../../crates/transport", version = "0.8.3" }
minip2p-identity = { path = "../../crates/identity", version = "0.8.3" }
minip2p-core = { path = "../../crates/core", version = "0.8.3" }
minip2p-tls = { path = "../../crates/tls", version = "0.8.3" }
quinn-proto = { version = "0.11.19", default-features = false, features = [
  "rustls-ring",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
quinn-udp = { version = "0.6.3", default-features = false }
bytes = "1.12.1"
mio = { version = "1.2", features = ["net", "os-poll"] }
socket2 = "0.6.5"
thiserror = "2.0.20"

[dev-dependencies]
criterion = "0.8.2"
minip2p-multistream-select = { path = "../../crates/multistream-select" }
minip2p-ping = { path = "../../crates/ping" }
minip2p-swarm = { path = "../../crates/swarm" }
minip2p-identity = { path = "../../crates/identity" }

[[bench]]
name = "idle_poll"
harness = false
