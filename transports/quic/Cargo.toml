[package]
name = "minip2p-quic"
description = "Caller-driven QUIC transport adapter for minip2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
minip2p-transport = { path = "../../crates/transport", version = "0.1.2" }
minip2p-identity = { path = "../../crates/identity", version = "0.1.2" }
minip2p-core = { path = "../../crates/core", version = "0.1.2" }
minip2p-tls = { path = "../../crates/tls", version = "0.1.2" }
boring = "4.22.0"
quiche = { version = "0.29.2", features = ["boringssl-boring-crate"] }
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"

[dev-dependencies]
minip2p-multistream-select = { path = "../../crates/multistream-select" }
minip2p-ping = { path = "../../crates/ping" }
minip2p-identify = { path = "../../crates/identify" }
minip2p-swarm = { path = "../../crates/swarm" }
minip2p-identity = { path = "../../crates/identity" }
