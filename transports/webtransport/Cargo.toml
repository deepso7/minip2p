[package]
name = "minip2p-webtransport"
description = "Sans-I/O HTTP/3 and QPACK codec for libp2p WebTransport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
  "minip2p-core/std",
  "minip2p-identity/std",
  "minip2p-secure-mux/std",
  "minip2p-transport/std",
  "thiserror/std",
]

[dependencies]
minip2p-core = { path = "../../crates/core", version = "0.10.5", default-features = false }
minip2p-identity = { path = "../../crates/identity", version = "0.10.5", default-features = false, features = [
  "ed25519",
] }
minip2p-secure-mux = { path = "../../crates/secure-mux", version = "0.10.5", default-features = false }
minip2p-transport = { path = "../../crates/transport", version = "0.10.5", default-features = false }
thiserror = { workspace = true }
